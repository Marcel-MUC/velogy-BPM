function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= ERROR NOTIFICATIONS (top-right, auto-dismiss) ================= */
window.addEventListener('error', function(e){
  showError('Unexpected error: ' + e.message);
});
window.addEventListener('unhandledrejection', function(e){
  showError('Unexpected error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
function showError(message){
  let stack = document.getElementById('error-toast-stack');
  if(!stack){
    stack = document.createElement('div');
    stack.id = 'error-toast-stack';
    stack.className = 'error-toast-stack';
    document.body.appendChild(stack);
  }
  const el = document.createElement('div');
  el.className = 'error-toast';
  const icon = document.createElement('span');
  icon.className = 'error-toast-icon';
  icon.textContent = '⚠';
  const msgEl = document.createElement('span');
  msgEl.className = 'error-toast-msg';
  msgEl.textContent = message;
  el.appendChild(icon); el.appendChild(msgEl);
  stack.prepend(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 250);
  }, 5000);
}

/* ================= CUSTOM CONFIRM DIALOG ================= */
function showConfirm(message){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay blur';
    const modal = document.createElement('div');
    modal.className = 'modal';
    const msgEl = document.createElement('p');
    msgEl.style.cssText = 'margin:0 0 20px; font-size:14px; color:var(--gray-900); line-height:1.5;';
    msgEl.textContent = message;
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:10px; justify-content:flex-end;';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-ghost';
    cancelBtn.textContent = 'Cancel';
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn btn-danger';
    confirmBtn.textContent = 'Confirm';
    actions.appendChild(cancelBtn); actions.appendChild(confirmBtn);
    modal.appendChild(msgEl); modal.appendChild(actions);
    overlay.appendChild(modal);
    function finish(result){ overlay.remove(); resolve(result); }
    overlay.addEventListener('click', e=>{ if(e.target === overlay) finish(false); });
    cancelBtn.addEventListener('click', ()=> finish(false));
    confirmBtn.addEventListener('click', ()=> finish(true));
    document.body.appendChild(overlay);
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=> t.classList.remove('show'), 2400);
}
const debounceTimers = {};
function debounced(key, fn, delay=700){
  clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(fn, delay);
}
function sortTree(process){
  if(!process.subprocesses) return process;
  process.subprocesses.sort((a,b)=>a.position-b.position);
  process.subprocesses.forEach(sp=>{
    (sp.steps||[]).sort((a,b)=>a.position-b.position);
    sp.steps.forEach(st=>{
      (st.tasks||[]).sort((a,b)=>a.position-b.position);
      st.tasks.forEach(t=> (t.work_instructions||[]).sort((a,b)=>a.position-b.position));
    });
  });
  return process;
}

async function openEditor(processId){

          )

      )

  if(error){ showError(error.message); state.screen = 'companies'; render(); return; }
  data.subprocesses = data.subprocesses || [];
  data.subprocesses.forEach(sp=>{
    sp.steps = sp.steps || [];
    sp.steps.forEach(st=>{
      st.tasks = st.tasks || [];
      st.tasks.forEach(t=> t.work_instructions = t.work_instructions || []);
    });

  state.editorProcess = sortTree(data);
  state.editorSelectedSpId = (data.l2_locked && data.subprocesses.length>0) ? data.subprocesses[0].id : null;
  state.editorSelectedStepId = null;
  state.editorSelectedTaskId = null;

  const { data: siblings } = await sb.from('processes').select('id, l1_name').eq('company_id', data.company_id).order('l1_name');

  state.editorCanEdit = canEditError ? false : !!canEdit;
  state.screen = 'editor';
  render();
}

function formatExportTimestamp(d){
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getFullYear()%100)}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}
function sanitizeFilenamePart(s){
  return String(s||'').trim().replace(/\s+/g,'_').replace(/[^A-Za-z0-9_-]/g,'');
}
async function exportExcel(processIdOnly, companyIdOnly){
  let query = sb.from('processes').select(`
      l1_name, companies(name), departments(name),
      subprocesses ( name, position,
        steps ( text, position,
          tasks ( text, position,
            work_instructions ( text, position )
          )
        )
      )
    `);
  if(processIdOnly) query = query.eq('id', processIdOnly);
  else if(companyIdOnly) query = query.eq('company_id', companyIdOnly);
  const { data, error } = await query;
  if(error){ showError(error.message); return; }
  const rows = [];
  let hasAnySubprocessName = false;
  (data||[]).forEach(proc=>{
    (proc.subprocesses||[]).sort((a,b)=>a.position-b.position).forEach(sp=>{
      if(!sp.name || !sp.name.trim()) return;
      hasAnySubprocessName = true;
      (sp.steps||[]).sort((a,b)=>a.position-b.position).forEach(st=>{
        if(!st.text || !st.text.trim()) return;
        const base = {
          "Company": proc.companies ? proc.companies.name : '',
          "Department": proc.departments ? proc.departments.name : '',
          "L1 Mega-cycle": proc.l1_name,
          "L2 Sub-process": sp.name,
          "L3 Process step": st.text
        };
        const tasks = (st.tasks||[]).sort((a,b)=>a.position-b.position);
        if(tasks.length===0){ rows.push({...base, "L4 Task":'', "L5 Work instruction":''}); return; }
        tasks.forEach(task=>{
          if(!task.text || !task.text.trim()) return;
          const wis = (task.work_instructions||[]).sort((a,b)=>a.position-b.position)
            .filter(wi=> wi.text && wi.text.trim());
          if(wis.length===0){ rows.push({...base, "L4 Task":task.text, "L5 Work instruction":''}); return; }
          wis.forEach(wi=>{
            rows.push({...base, "L4 Task":task.text, "L5 Work instruction":wi.text||''});
          });
        });
      });
    });
  });
  if(rows.length===0){
    toast(hasAnySubprocessName
      ? 'Add at least one L3 process step before you can export.'
      : 'Nothing to export yet — add some content first.');
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:16},{wch:16},{wch:20},{wch:20},{wch:26},{wch:26},{wch:32}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Process Capture");

  const ts = formatExportTimestamp(new Date());
  let filename = `Export_All_${ts}.xlsx`;
  if(processIdOnly){
    const company = sanitizeFilenamePart(data[0]?.companies?.name);
    const megaCycle = sanitizeFilenamePart(data[0]?.l1_name);
    if(company && megaCycle) filename = `Export_${company}_${megaCycle}_${ts}.xlsx`;
  } else if(companyIdOnly){
    const company = sanitizeFilenamePart(data[0]?.companies?.name);
    if(company) filename = `Export_${company}_${ts}.xlsx`;
  }

  XLSX.writeFile(wb, filename);
  toast('Exported.');
}

function statsTimeWindows(){
  // Local browser time throughout, per spec — not UTC.
  const now = new Date();
  const startOfToday = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const daysSinceMonday = (startOfToday.getDay() + 6) % 7; // Mon->0 ... Sun->6
  const weekStart = new Date(startOfToday);
  weekStart.setDate(weekStart.getDate() - daysSinceMonday);
  const lastWeekStart = new Date(weekStart);
  lastWeekStart.setDate(lastWeekStart.getDate() - 7);
  const monthStart = new Date(now.getFullYear(), now.getMonth(), 1);
  const yearStart = new Date(now.getFullYear(), 0, 1);
  return { weekStart, lastWeekStart, monthStart, yearStart };
}
function countProcessLevels(p, bumpRecent){
  const counts = { l2:0, l3:0, l4:0, l5:0 };
  (p.subprocesses||[]).forEach(sp=>{
    if(sp.name && sp.name.trim()){ counts.l2++; if(bumpRecent) bumpRecent('l2', sp.created_at); }
    (sp.steps||[]).forEach(st=>{
      if(st.text && st.text.trim()){ counts.l3++; if(bumpRecent) bumpRecent('l3', st.created_at); }
      (st.tasks||[]).forEach(t=>{
        if(t.text && t.text.trim()){ counts.l4++; if(bumpRecent) bumpRecent('l4', t.created_at); }
        (t.work_instructions||[]).forEach(wi=>{
          if(wi.text && wi.text.trim()){ counts.l5++; if(bumpRecent) bumpRecent('l5', wi.created_at); }
        });
      });
    });
  });
  return counts;
}
function computeCaptureStats(companies){
  const totals = { l1:0, l2:0, l3:0, l4:0, l5:0 };
  const byCompanyMap = new Map();
  const byMegaCycleMap = new Map();
  const { weekStart, lastWeekStart, monthStart, yearStart } = statsTimeWindows();
  const recentlyAdded = {
    l1:{week:0,lastWeek:0,month:0,year:0}, l2:{week:0,lastWeek:0,month:0,year:0},
    l3:{week:0,lastWeek:0,month:0,year:0}, l4:{week:0,lastWeek:0,month:0,year:0},
    l5:{week:0,lastWeek:0,month:0,year:0}
  };
  function bumpRecent(level, createdAt){
    if(!createdAt) return;
    const d = new Date(createdAt);
    if(d >= weekStart) recentlyAdded[level].week++;
    else if(d >= lastWeekStart) recentlyAdded[level].lastWeek++;
    if(d >= monthStart) recentlyAdded[level].month++;
    if(d >= yearStart) recentlyAdded[level].year++;
  }

  companies.forEach(c=>{
    if(!byCompanyMap.has(c.name)) byCompanyMap.set(c.name, { name:c.name, l1:0, l2:0, l3:0, l4:0, l5:0 });
    const companyCounts = byCompanyMap.get(c.name);
    (c.processes||[]).forEach(p=>{
      const named = p.l1_name && p.l1_name.trim();
      if(named){
        companyCounts.l1++; totals.l1++;
        bumpRecent('l1', p.created_at);
      }
      const pc = countProcessLevels(p, bumpRecent);
      companyCounts.l2 += pc.l2; companyCounts.l3 += pc.l3; companyCounts.l4 += pc.l4; companyCounts.l5 += pc.l5;
      totals.l2 += pc.l2; totals.l3 += pc.l3; totals.l4 += pc.l4; totals.l5 += pc.l5;

      if(named){
        const key = p.l1_name.trim();
        if(!byMegaCycleMap.has(key)) byMegaCycleMap.set(key, { name:key, l1:0, l2:0, l3:0, l4:0, l5:0 });
        const mc = byMegaCycleMap.get(key);
        mc.l1++; mc.l2 += pc.l2; mc.l3 += pc.l3; mc.l4 += pc.l4; mc.l5 += pc.l5;
      }
    });
  });

  const byCompany = Array.from(byCompanyMap.values()).sort((a,b)=>a.name.localeCompare(b.name));
  const byMegaCycle = Array.from(byMegaCycleMap.values()).sort((a,b)=>a.name.localeCompare(b.name));
  return { totals, byCompany, byMegaCycle, recentlyAdded };
}
async function computeSessionMappingStats(session){
  const [{ data: itemRows }, { data: compRows }] = await Promise.all([
    sb.from('target_items').select('*').eq('session_id', session.id),
    sb.from('build_completions').select('*').eq('session_id', session.id)
  ]);
  const items = itemRows || [];
  const comps = compRows || [];
  const itemsById = new Map(items.map(t=>[t.id, t]));
  const nameA = compareCompanyName(session.company_a_id);
  const nameB = compareCompanyName(session.company_b_id);

  // Same status derivation the build tool's cards use — never a separate rule.
  let merged=0, adoptedA=0, adoptedB=0, brandNew=0;
  items.forEach(t=>{
    const { statusLabel } = deriveTargetItemStatus(t, nameA, nameB);
    if(statusLabel==='Merged') merged++;
    else if(statusLabel===`Adopted from ${nameA}`) adoptedA++;
    else if(statusLabel===`Adopted from ${nameB}`) adoptedB++;
    else brandNew++;
  });

  // "Building has started" scopes = every distinct (level, parent) that has
  // at least one target_item or build_completions row — same definition the
  // build tool itself effectively uses (a scope with neither is never shown
  // as anything but blank, since it's never been opened/auto-suggested).
  const scopeMap = new Map();
  function addScope(level, parentTargetItemId, l1A, l1B){
    const key = `${level}|${parentTargetItemId||''}|${l1A||''}|${l1B||''}`;
    if(!scopeMap.has(key)) scopeMap.set(key, { level, parentTargetItemId, l1ProcessAId:l1A, l1ProcessBId:l1B });
  }
  items.forEach(t=> addScope(t.level, t.parent_target_item_id, t.l1_process_a_id, t.l1_process_b_id));
  comps.forEach(c=> addScope(c.level, c.parent_target_item_id, c.l1_process_a_id, c.l1_process_b_id));

  const scopes = Array.from(scopeMap.values()).map(scope=>{
    let parentAId, parentBId;
    if(scope.parentTargetItemId){
      const parentItem = itemsById.get(scope.parentTargetItemId);
      parentAId = parentItem ? parentItem.source_item_a_id : null;
      parentBId = parentItem ? parentItem.source_item_b_id : null;
    } else {
      parentAId = scope.l1ProcessAId;
      parentBId = scope.l1ProcessBId;
    }
    const finished = comps.some(c=> c.level===scope.level && c.parent_target_item_id===scope.parentTargetItemId
      && c.l1_process_a_id===scope.l1ProcessAId && c.l1_process_b_id===scope.l1ProcessBId);
    const scopeItems = items.filter(t=> t.level===scope.level && t.parent_target_item_id===scope.parentTargetItemId
      && t.l1_process_a_id===scope.l1ProcessAId && t.l1_process_b_id===scope.l1ProcessBId);
    return {
      ...scope, parentAId, parentBId, finished,
      attachedA: new Set(scopeItems.map(t=>t.source_item_a_id).filter(Boolean)),
      attachedB: new Set(scopeItems.map(t=>t.source_item_b_id).filter(Boolean))
    };
  });

  // Batch one query per level per side (covering every scope's parent id at
  // once), instead of one query per scope — same batching technique as the
  // build tool's own next-level-existence check.
  let openCount = 0, eliminatedCount = 0;
  for(const level of ['l2','l3','l4','l5']){
    const levelScopes = scopes.filter(s=>s.level===level);
    if(levelScopes.length===0) continue;
    const cfg = COMPARE_LEVEL_CONFIG[level];
    const parentAIds = [...new Set(levelScopes.map(s=>s.parentAId).filter(Boolean))];
    const parentBIds = [...new Set(levelScopes.map(s=>s.parentBId).filter(Boolean))];
    const [rowsA, rowsB] = await Promise.all([
      parentAIds.length ? sb.from(cfg.table).select(`id, ${cfg.parentCol}`).in(cfg.parentCol, parentAIds) : Promise.resolve({data:[]}),
      parentBIds.length ? sb.from(cfg.table).select(`id, ${cfg.parentCol}`).in(cfg.parentCol, parentBIds) : Promise.resolve({data:[]})
    ]);
    const byParentA = new Map();
    (rowsA.data||[]).forEach(r=>{
      const key = r[cfg.parentCol];
      if(!byParentA.has(key)) byParentA.set(key, []);
      byParentA.get(key).push(r.id);
    });
    const byParentB = new Map();
    (rowsB.data||[]).forEach(r=>{
      const key = r[cfg.parentCol];
      if(!byParentB.has(key)) byParentB.set(key, []);
      byParentB.get(key).push(r.id);
    });
    levelScopes.forEach(s=>{
      const idsA = s.parentAId ? (byParentA.get(s.parentAId)||[]) : [];
      const idsB = s.parentBId ? (byParentB.get(s.parentBId)||[]) : [];
      const remainingA = idsA.filter(id=>!s.attachedA.has(id)).length;
      const remainingB = idsB.filter(id=>!s.attachedB.has(id)).length;
      if(s.finished) eliminatedCount += remainingA + remainingB;
      else openCount += remainingA + remainingB;
    });
  }

  return {
    sessionId: session.id, nameA, nameB,
    merged, adoptedA, adoptedB, brandNew,
    open: openCount, eliminated: eliminatedCount,
    finishedLevels: comps.length
  };
}

    const payload = isGroup

/* ================= COMPARE (admin: map two companies' trees) ================= */
const COMPARE_LEVELS = ['l1','l2','l3','l4','l5'];
const COMPARE_LEVEL_CONFIG = {
  l1: { table:'processes', labelCol:'l1_name', parentCol:'company_id' },
  l2: { table:'subprocesses', labelCol:'name', parentCol:'process_id' },
  l3: { table:'steps', labelCol:'text', parentCol:'subprocess_id' },
  l4: { table:'tasks', labelCol:'text', parentCol:'step_id' },
  l5: { table:'work_instructions', labelCol:'text', parentCol:'task_id' }
};
// What's missing, named by the parent level, when a source column's company
// has no item to descend from here (a one-sided mega-cycle, or a target item
// built with only one source) — e.g. viewing L2 with no parent process means
// that company has no such mega-cycle.
const COMPARE_MISSING_PARENT_LABEL = { l2:'mega-cycle', l3:'sub-process', l4:'process step', l5:'task' };
function compareCurrentLevel(){ return COMPARE_LEVELS[state.comparePath.length]; }
function compareNormalize(s){ return (s||'').trim().toLowerCase(); }
function compareCompanyName(companyId){
  const c = state.companies.find(x=>x.id===companyId);
  return c ? c.name : companyId;
}
function compareItemLabel(side, itemId){
  const items = side==='a' ? state.compareItemsA : state.compareItemsB;
  const item = items.find(i=>i.id===itemId);
  return item ? item.label : '';
}
// Shared status derivation for a target_item, from its two source slots —
// used both for the build tool's status pills and the Statistics tab's
// per-session breakdown, so the two never drift apart. nameA/nameB should
// be the raw (unescaped) company names; escape the returned statusLabel at
// the point of HTML insertion, not here.
function deriveTargetItemStatus(t, nameA, nameB){
  const both = !!(t.source_item_a_id && t.source_item_b_id);
  const onlyA = !!(t.source_item_a_id && !t.source_item_b_id);
  const onlyB = !!(!t.source_item_a_id && t.source_item_b_id);
  const statusClass = both ? 'match' : (onlyA||onlyB) ? 'partial' : 'new';

  return { statusClass, statusLabel };
}
function compareItemsForCompanyL1(companyId){
  const c = state.companies.find(x=>x.id===companyId);
  const items = (c && c.processes) ? c.processes.map(p=>({ id:p.id, label:p.l1_name || '' })) : [];
  items.sort((x,y)=>x.label.localeCompare(y.label));
  return items;
}
function computeCompareL1Matches(){
  const itemsA = state.compareItemsA, itemsB = state.compareItemsB;
  const usedA = new Set(), usedB = new Set(), matched = [];
  itemsA.forEach(a=>{
    if(compareNormalize(a.label)==='') return;
    const b = itemsB.find(x=> !usedB.has(x.id) && compareNormalize(x.label)===compareNormalize(a.label));
    if(b){ usedA.add(a.id); usedB.add(b.id); matched.push({ a, b }); }
  });
  return { matched, usedA, usedB };
}
async function fetchCompareItems(level, parentId){
  if(!parentId) return [];
  const cfg = COMPARE_LEVEL_CONFIG[level];
  const { data, error } = await sb.from(cfg.table).select(`id, ${cfg.labelCol}, position`).eq(cfg.parentCol, parentId);
  if(error){ showError(error.message); return []; }
  const items = (data||[]).map(r=>({ id:r.id, label:r[cfg.labelCol] || '', position:r.position||0 }));
  items.sort((x,y)=> x.position - y.position || x.label.localeCompare(y.label));
  return items;
}
async function loadCompareSessions(){

  state.compareSessions = (sessions||[]).map(s=>({ ...s, itemCount: counts[s.id] || 0 }));
}

function currentBuildScope(){
  const level = compareCurrentLevel();
  if(level === 'l1') return null;
  if(state.comparePath.length === 1){
    // Top of a build tree: parent is an L1 mega-cycle (a matched pair, or a
    // one-sided one — either itemA or itemB may be null, never a target_item).
    const root = state.comparePath[0];
    return {
      level, parentTargetItemId:null,
      l1ProcessAId: root.itemA ? root.itemA.id : null, l1ProcessBId: root.itemB ? root.itemB.id : null,
      parentAId: root.itemA ? root.itemA.id : null, parentBId: root.itemB ? root.itemB.id : null
    };
  }
  const parentEntry = state.comparePath[state.comparePath.length - 1];
  const ti = parentEntry.targetItem;
  return {
    level, parentTargetItemId: ti.id,
    l1ProcessAId:null, l1ProcessBId:null,
    parentAId: ti.source_item_a_id, parentBId: ti.source_item_b_id
  };
}
function buildTargetItemPayload(scope, name, sourceAId, sourceBId, position){
  return {
    session_id: state.compareSession.id,
    level: scope.level,
    parent_target_item_id: scope.parentTargetItemId,
    l1_process_a_id: scope.parentTargetItemId ? null : scope.l1ProcessAId,
    l1_process_b_id: scope.parentTargetItemId ? null : scope.l1ProcessBId,
    name: name || '',
    position: position || 0,
    source_item_a_id: sourceAId || null,
    source_item_b_id: sourceBId || null

}
// A root scope's l1ProcessAId/l1ProcessBId can each independently be a real
// id or null (a one-sided mega-cycle) — null needs `.is()`, not `.eq()`,
// since Postgres/PostgREST don't treat `col = null` as `col is null`.
function applyRootScopeFilter(q, scope){
  q = q.is('parent_target_item_id', null);
  q = scope.l1ProcessAId ? q.eq('l1_process_a_id', scope.l1ProcessAId) : q.is('l1_process_a_id', null);
  q = scope.l1ProcessBId ? q.eq('l1_process_b_id', scope.l1ProcessBId) : q.is('l1_process_b_id', null);
  return q;
}
async function fetchTargetItemsForScope(scope){
  let q = sb.from('target_items').select('*').eq('session_id', state.compareSession.id).eq('level', scope.level);
  q = scope.parentTargetItemId ? q.eq('parent_target_item_id', scope.parentTargetItemId) : applyRootScopeFilter(q, scope);
  const { data, error } = await q.order('position');
  if(error){ showError(error.message); return []; }
  return data || [];
}
async function fetchBuildCompletion(scope){
  let q = sb.from('build_completions').select('*').eq('session_id', state.compareSession.id).eq('level', scope.level);
  q = scope.parentTargetItemId ? q.eq('parent_target_item_id', scope.parentTargetItemId) : applyRootScopeFilter(q, scope);
  const { data, error } = await q.maybeSingle();
  if(error){ showError(error.message); return null; }
  return data;
}
async function loadCompareLevel(){
  const level = compareCurrentLevel();
  if(level === 'l1'){
    state.compareItemsA = compareItemsForCompanyL1(state.compareSession.company_a_id);
    state.compareItemsB = compareItemsForCompanyL1(state.compareSession.company_b_id);
    state.compareTargetItems = [];
    state.compareBuildCompletion = null;
    render();
    return;
  }
  const scope = currentBuildScope();
  const [itemsA, itemsB] = await Promise.all([
    fetchCompareItems(level, scope.parentAId),
    fetchCompareItems(level, scope.parentBId)
  ]);
  state.compareItemsA = itemsA;
  state.compareItemsB = itemsB;

  let targetItems = await fetchTargetItemsForScope(scope);

  if(targetItems.length === 0){
    // First time this exact level+parent scope has been opened — auto-build
    // target items for exact-name matches, same as before but producing
    // pre-built "Merged" target items instead of pre-set link statuses.
    const usedB = new Set();
    const inserts = [];
    itemsA.forEach(a=>{
      if(compareNormalize(a.label)==='') return;
      const match = itemsB.find(b=> !usedB.has(b.id) && compareNormalize(b.label)===compareNormalize(a.label));
      if(match){
        usedB.add(match.id);
        inserts.push(buildTargetItemPayload(scope, a.label, a.id, match.id, inserts.length));
      }
    });
    if(inserts.length){
      const { data: inserted, error } = await sb.from('target_items').insert(inserts).select();
      if(error) showError(error.message);
      else targetItems = (inserted || []).sort((x,y)=>x.position-y.position);
    }
  }
  state.compareTargetItems = targetItems;
  state.compareBuildCompletion = await fetchBuildCompletion(scope);

  const nextLevel = COMPARE_LEVELS[COMPARE_LEVELS.indexOf(level)+1];
  const targetIds = targetItems.map(t=>t.id);
  const [childrenA, childrenB, targetChildParents, childCompletions] = await Promise.all([
    fetchChildExistenceSet(nextLevel, itemsA.map(i=>i.id)),
    fetchChildExistenceSet(nextLevel, itemsB.map(i=>i.id)),
    fetchTargetChildParentSet(nextLevel, targetIds),
    fetchChildCompletionSet(nextLevel, targetIds)
  ]);
  state.compareSourceChildrenA = childrenA;
  state.compareSourceChildrenB = childrenB;
  state.compareTargetChildParents = targetChildParents;
  state.compareChildCompletions = childCompletions;
  render();
}
async function fetchChildExistenceSet(nextLevel, parentIds){
  if(!nextLevel || parentIds.length===0) return new Set();
  const cfg = COMPARE_LEVEL_CONFIG[nextLevel];
  const { data, error } = await sb.from(cfg.table).select(cfg.parentCol).in(cfg.parentCol, parentIds);
  if(error){ showError(error.message); return new Set(); }

async function fetchTargetChildParentSet(nextLevel, parentTargetIds){
  if(!nextLevel || parentTargetIds.length===0) return new Set();

    .eq('level', nextLevel).in('parent_target_item_id', parentTargetIds);
  if(error){ showError(error.message); return new Set(); }
  return new Set((data||[]).map(r=>r.parent_target_item_id));
}
async function fetchChildCompletionSet(nextLevel, parentTargetIds){
  if(!nextLevel || parentTargetIds.length===0) return new Set();
  const { data, error } = await sb.from('build_completions').select('parent_target_item_id')
    .eq('level', nextLevel).in('parent_target_item_id', parentTargetIds);
  if(error){ showError(error.message); return new Set(); }
  return new Set((data||[]).map(r=>r.parent_target_item_id));
}
function isTargetItemDrillable(t){
  if(!t.source_item_a_id && !t.source_item_b_id) return true;
  if(state.compareTargetChildParents.has(t.id)) return true;
  if(t.source_item_a_id && state.compareSourceChildrenA.has(t.source_item_a_id)) return true;
  if(t.source_item_b_id && state.compareSourceChildrenB.has(t.source_item_b_id)) return true;

}
function findFinishBlocker(){
  const level = compareCurrentLevel();
  const nextLevel = COMPARE_LEVELS[COMPARE_LEVELS.indexOf(level)+1];

/* ---------- Generic drag-and-drop engine (source reorder, target reorder, source-to-target) ----------

   would tear down the very elements the browser is dragging. state.compare* is
   only updated (and render() called) once a drop actually completes. */

    .forEach(el=>el.classList.remove('drop-active','drop-invalid'));

}
function setHoveredCard(card){

function clearHoveredCard(){
  if(dragState.hoveredCard){ dragState.hoveredCard.classList.remove('drop-active'); dragState.hoveredCard = null; }

function removeDragPlaceholder(){

}
function isDropCompatible(zoneType, payload){

  if(zoneType==='source-b') return payload.kind==='source' && payload.side==='b';

    const dy = first.top - last.top;

      r.style.transform = `translateY(${dy}px)`;

function updateAutoScroll(container, clientY){

  else if(rect.bottom - clientY < threshold) speed = (threshold - (rect.bottom - clientY)) / 3 + 1;

function reorderSourceColumn(side, itemId, insertIndex){

  if(fromIdx===-1) return;
  const [moved] = list.splice(fromIdx,1);
  const idx = Math.max(0, Math.min(insertIndex, list.length));
  list.splice(idx, 0, moved);
  render();
  const table = COMPARE_LEVEL_CONFIG[compareCurrentLevel()].table;
  debounced('source-reorder-'+side, async ()=>{
    const updates = [];
    list.forEach((item, i)=>{
      if(item.position !== i){
        item.position = i;
        updates.push(sb.from(table).update({ position:i }).eq('id', item.id));
      }
    });
    if(updates.length){
      const results = await Promise.all(updates);
      const failed = results.find(r=>r.error);
      reportSaveResult(failed ? failed.error : null, failed ? null : [1]);
    }
  });
}
function reorderTargetItem(targetItemId, insertIndex){

  if(fromIdx===-1) return;
  const [moved] = list.splice(fromIdx,1);
  const idx = Math.max(0, Math.min(insertIndex, list.length));
  list.splice(idx, 0, moved);
  render();
  debounced('target-reorder', async ()=>{
    const updates = [];
    list.forEach((item, i)=>{
      if(item.position !== i){
        item.position = i;
        updates.push(sb.from('target_items').update({ position:i }).eq('id', item.id));
      }
    });
    if(updates.length){
      const results = await Promise.all(updates);
      const failed = results.find(r=>r.error);

  });

  const { data, error } = await sb.from('target_items').insert(payload).select().single();
  if(error){ showError(error.message); return; }
  const idx = Math.max(0, Math.min(insertIndex, state.compareTargetItems.length));
  state.compareTargetItems.splice(idx, 0, data);
  render();
  debounced('target-reorder', async ()=>{
    const updates = [];
    state.compareTargetItems.forEach((item, i)=>{
      if(item.position !== i){
        item.position = i;
        updates.push(sb.from('target_items').update({ position:i }).eq('id', item.id));
      }

  });

async function attachSourceToTarget(side, itemId, targetItemId){

  const { data, error } = await sb.from('target_items').update({ [field]: itemId }).eq('id', targetItemId).select().single();
  if(error){ showError(error.message); return; }

async function detachSourceFromAllTargets(side, itemId, exceptTargetItemId){

async function createBlankTargetItem(){

  const { data, error } = await sb.from('target_items').insert(payload).select().single();
  if(error){ showError(error.message); return; }
  state.compareTargetItems.push(data);
  render();
}
function onTargetItemNameInput(targetItemId, v){
  if(state.compareBuildCompletion) return;
  const item = state.compareTargetItems.find(t=>t.id===targetItemId);
  if(item) item.name = v;
  debounced('target-item-'+targetItemId, async ()=>{
    const { data, error } = await sb.from('target_items').update({ name:v }).eq('id', targetItemId).select();
    reportSaveResult(error, data);
  });
}
async function removeTargetItem(targetItemId){
  if(state.compareBuildCompletion){ toast('This level is finished — reopen it first.'); return; }
  if(!await showConfirm('Remove this target item? Any deeper items built under it will be removed too.')) return;
  const { error } = await sb.from('target_items').delete().eq('id', targetItemId);
  if(error){ showError(error.message); return; }
  state.compareTargetItems = state.compareTargetItems.filter(t=>t.id!==targetItemId);
  render();
}
async function finishLevel(){
  if(state.compareBuildCompletion) return;
  const blocker = findFinishBlocker();
  if(blocker){ toast('Finish the deeper level for "'+(blocker.name||'(untitled)')+'" first.'); return; }
  const scope = currentBuildScope();
  const payload = {
    session_id: state.compareSession.id, level: scope.level,
    parent_target_item_id: scope.parentTargetItemId,
    l1_process_a_id: scope.parentTargetItemId ? null : scope.l1ProcessAId,
    l1_process_b_id: scope.parentTargetItemId ? null : scope.l1ProcessBId,
    completed_by: state.profile.id
  };
  const { data, error } = await sb.from('build_completions').insert(payload).select().single();
  if(error){ showError(error.message); return; }
  state.compareBuildCompletion = data;
  render();
}
async function reopenLevel(){
  if(!state.compareBuildCompletion) return;
  if(!await showConfirm('Reopen this level? Unlinked items will show as Open again instead of Eliminated.')) return;
  const { error } = await sb.from('build_completions').delete().eq('id', state.compareBuildCompletion.id);
  if(error){ showError(error.message); return; }
  state.compareBuildCompletion = null;
  render();
}
function resetDrillUiState(){
  state.compareItemsA = []; state.compareItemsB = [];
  state.compareTargetItems = []; state.compareBuildCompletion = null;
  state.compareSourceChildrenA = new Set(); state.compareSourceChildrenB = new Set();
  state.compareTargetChildParents = new Set(); state.compareChildCompletions = new Set();
}
function drillIntoCompareL1(processAId, processBId){
  state.comparePath.push({
    level: 'l1',
    itemA: processAId ? { id: processAId, label: compareItemLabel('a', processAId) } : null,
    itemB: processBId ? { id: processBId, label: compareItemLabel('b', processBId) } : null
  });
  resetDrillUiState();
  render();
  loadCompareLevel();
}
function drillIntoTargetItem(targetItemId){
  const level = compareCurrentLevel();
  if(level === 'l5') return;
  const item = state.compareTargetItems.find(t=>t.id===targetItemId);
  if(!item || (!item.source_item_a_id && !item.source_item_b_id)) return;
  state.comparePath.push({ level, targetItem: item });
  resetDrillUiState();
  render();
  loadCompareLevel();
}
function compareBreadcrumbTo(index){
  state.comparePath = state.comparePath.slice(0, index+1);
  resetDrillUiState();
  render();
  loadCompareLevel();
}

function renderCompareSessionsList(){
  return state.compareSessions.map(s=>{
    const nameA = compareCompanyName(s.company_a_id);
    const nameB = compareCompanyName(s.company_b_id);
    return `<div class="dash-item" style="cursor:pointer;" onclick="openExistingCompareSession('${s.id}')">
      <h3 style="margin:0;">${escapeHtml(nameA)} ↔ ${escapeHtml(nameB)}</h3>
      <span style="font-size:12px; color:var(--gray-500); flex-shrink:0;">${s.itemCount} item${s.itemCount===1?'':'s'} built · ${escapeHtml(new Date(s.created_at).toLocaleDateString())}</span>
    </div>`;

}
function renderComparePicker(){

  <div class="wrap">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; padding-left:16px;">

function renderCompareBreadcrumb(){
  const session = state.compareSession;
  const nameA = compareCompanyName(session.company_a_id);
  const nameB = compareCompanyName(session.company_b_id);
  const rootLabel = `${nameA} ↔ ${nameB}`;
  const crumbs = [`<span class="compare-crumb ${state.comparePath.length===0?'current':''}" onclick="compareBreadcrumbTo(-1)">${escapeHtml(rootLabel)}</span>`];
  state.comparePath.forEach((p, idx)=>{
    const isCurrent = idx === state.comparePath.length-1;
    const label = p.level==='l1' ? ((p.itemA || p.itemB).label || '—') : (p.targetItem.name || '(untitled)');
    crumbs.push(`<span class="compare-crumb-sep">›</span>`);
    crumbs.push(`<span class="compare-crumb ${isCurrent?'current':''}" onclick="compareBreadcrumbTo(${idx})">${escapeHtml(label)}</span>`);
  });
  return crumbs.join('');
}
function renderCompareL1Matched(l1Matches){
  if(l1Matches.matched.length===0) return `<div class="empty-note">No matching mega-cycle names yet.</div>`;
  return l1Matches.matched.map(m=>`
    <div class="compare-pair-row">
      <span class="compare-pair-label">${escapeHtml(m.a.label)}</span>
      <span class="compare-pair-arrow">↔</span>
      <span class="compare-pair-label">${escapeHtml(m.b.label)}</span>
      <button class="link-btn" onclick="drillIntoCompareL1('${m.a.id}','${m.b.id}')">Open L2 ›</button>
    </div>`).join('');
}
function renderCompareL1OnlyColumn(side, l1Matches){
  const items = side==='a' ? state.compareItemsA : state.compareItemsB;
  const used = side==='a' ? l1Matches.usedA : l1Matches.usedB;
  const onlyItems = items.filter(i=>!used.has(i.id));
  if(onlyItems.length===0) return `<div class="empty-note">Nothing unique here.</div>`;
  return onlyItems.map(i=>`
    <div class="compare-item-row static">
      <span>${escapeHtml(i.label || '(untitled)')}</span>
      <button class="link-btn" onclick="drillIntoCompareL1(${side==='a' ? `'${i.id}'` : 'null'}, ${side==='b' ? `'${i.id}'` : 'null'})">Open L2 ›</button>
    </div>`).join('');
}
function renderCompareSourceColumn(side, editable){
  const scope = currentBuildScope();
  const parentId = side==='a' ? scope.parentAId : scope.parentBId;
  if(!parentId){
    const companyName = compareCompanyName(side==='a' ? state.compareSession.company_a_id : state.compareSession.company_b_id);
    const label = COMPARE_MISSING_PARENT_LABEL[scope.level] || 'item';
    return `<div class="compare-source-dropzone"><div class="empty-note">${escapeHtml(companyName)} doesn't have this ${label}.</div></div>`;
  }
  const items = side==='a' ? state.compareItemsA : state.compareItemsB;
  const field = side==='a' ? 'source_item_a_id' : 'source_item_b_id';
  const attached = new Set(state.compareTargetItems.map(t=>t[field]).filter(Boolean));
  const remaining = items.filter(i=>!attached.has(i.id));
  const finished = !!state.compareBuildCompletion;
  const zoneType = side==='a' ? 'source-a' : 'source-b';
  const rowsHtml = remaining.map(i=>`
    <div class="compare-item-row ${editable?'':'static'}" data-drag-id="${i.id}"
      ${editable ? `draggable="true" onmousedown="onDraggableMouseDown(event, this)" ondragstart="onRowDragStart(event,'source','${side}','${i.id}')" ondragend="onRowDragEnd()"` : ''}>
      <span style="flex:1;">${escapeHtml(i.label || '(untitled)')}</span>
      <span class="compare-status-badge ${finished?'gap':'open'}">${finished?'Eliminated':'Open'}</span>
    </div>`).join('');
  const empty = remaining.length===0 ? `<div class="empty-note">Nothing left here.</div>` : '';
  if(!editable) return `<div class="compare-source-dropzone">${rowsHtml}${empty}</div>`;
  return `<div class="compare-dropzone compare-source-dropzone" data-zone="${zoneType}"
    ondragover="onZoneDragOver(event, this, '${zoneType}')"
    ondragleave="onZoneDragLeave(event, this)"
    ondrop="onZoneDrop(event, this, '${zoneType}')">
    ${rowsHtml}${empty}
  </div>`;
}
function renderCompareTargetColumn(editable){
  const level = compareCurrentLevel();
  const nextLevel = COMPARE_LEVELS[COMPARE_LEVELS.indexOf(level)+1];
  const nameA = compareCompanyName(state.compareSession.company_a_id);
  const nameB = compareCompanyName(state.compareSession.company_b_id);
  const cardsHtml = state.compareTargetItems.map(t=>{
    const { statusClass, statusLabel } = deriveTargetItemStatus(t, nameA, nameB);
    const drillable = !!nextLevel && isTargetItemDrillable(t);
    return `<div class="compare-target-card" data-drag-id="${t.id}"
      ${editable ? `draggable="true" onmousedown="onDraggableMouseDown(event, this)" ondragstart="onRowDragStart(event,'target',null,'${t.id}')" ondragend="onRowDragEnd()"` : ''}>
      ${editable
        ? `<input type="text" class="compare-target-name no-drag" value="${escapeHtml(t.name||'')}" placeholder="Name…" oninput="onTargetItemNameInput('${t.id}', this.value)">`
        : `<div class="compare-target-name-static">${escapeHtml(t.name || '(untitled)')}</div>`}
      <div class="compare-target-footer">
        <span class="compare-status-badge ${statusClass}">${escapeHtml(statusLabel)}</span>
        ${drillable ? `<button class="link-btn no-drag" onclick="drillIntoTargetItem('${t.id}')">Open ${nextLevel.toUpperCase()} ›</button>` : ''}
        ${editable ? `<button class="icon-btn no-drag" onclick="removeTargetItem('${t.id}')">✕</button>` : ''}
      </div>
    </div>`;
  }).join('');
  const empty = state.compareTargetItems.length===0 ? `<div class="empty-note">Nothing built yet — drag items here.</div>` : '';
  const zoneHtml = editable
    ? `<div class="compare-dropzone compare-target-dropzone" data-zone="target"
        ondragover="onZoneDragOver(event, this, 'target')"
        ondragleave="onZoneDragLeave(event, this)"
        ondrop="onZoneDrop(event, this, 'target')">
        ${cardsHtml}${empty}
      </div>`
    : `<div class="compare-target-dropzone">${cardsHtml}${empty}</div>`;
  return `${zoneHtml}
    ${editable ? `<div class="row-input" style="margin-top:8px;">
      <input type="text" id="new-target-item-input" placeholder="+ new item">
      <button class="btn btn-ghost" onclick="createBlankTargetItem()">Add</button>
    </div>` : ''}`;
}
function renderCompare(){
  const session = state.compareSession;
  if(!session) return `${renderHeader()}<div class="wrap"><div class="empty-note">No comparison session selected. <button class="link-btn" onclick="openComparePicker()">Start one</button></div></div>`;
  const level = compareCurrentLevel();
  const nameA = compareCompanyName(session.company_a_id);
  const nameB = compareCompanyName(session.company_b_id);
  const isAdmin = state.profile.role==='admin';
  const headerBlock = `
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; flex-wrap:wrap; gap:12px; padding-left:16px;">
      <div style="font-weight:800; font-size:22px; color:var(--gray-900); letter-spacing:-.01em;">Compare: ${escapeHtml(nameA)} ↔ ${escapeHtml(nameB)}</div>
      <button class="btn btn-ghost" onclick="openComparePicker()">Home</button>
    </div>
    <div class="compare-breadcrumb-bar">${renderCompareBreadcrumb()}</div>`;

  if(level === 'l1'){
    const l1Matches = computeCompareL1Matches();
    return `${renderHeader()}
    <div class="wrap">
      ${headerBlock}
      <div class="card">
        <div class="card-title" style="margin-bottom:4px;">Mega-cycles <span style="opacity:.5; font-weight:600;">(L1)</span></div>
        <div class="card-hint" style="margin-bottom:16px;">Matched pairs</div>
        ${renderCompareL1Matched(l1Matches)}
        <div class="subblock-title" style="margin:20px 0 10px;">Only in one company</div>
        <div class="compare-columns">
          <div class="compare-col"><div class="compare-col-title">${escapeHtml(nameA)}</div>${renderCompareL1OnlyColumn('a', l1Matches)}</div>
          <div class="compare-col"><div class="compare-col-title">${escapeHtml(nameB)}</div>${renderCompareL1OnlyColumn('b', l1Matches)}</div>
        </div>
      </div>
    </div>`;
  }

  const levelTitles = { l2:'Sub-processes', l3:'Process steps', l4:'Tasks', l5:'Work instructions' };
  const finished = !!state.compareBuildCompletion;
  const editable = isAdmin && !finished;
  const nextLevelForFinish = COMPARE_LEVELS[COMPARE_LEVELS.indexOf(level)+1];
  const finishBlocker = (!finished && nextLevelForFinish) ? findFinishBlocker() : null;
  return `${renderHeader()}
  <div class="wrap">
    ${headerBlock}
    <div class="card">
      <div class="card-title" style="margin-bottom:4px;">${levelTitles[level]} <span style="opacity:.5; font-weight:600;">(${level.toUpperCase()})</span></div>
      <div class="card-hint" style="margin-bottom:16px; display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap;">
        <span>${finished ? 'This level is finished — reopen it to make changes.' : 'Drag items from either side onto the target column to build it.'}</span>
        ${isAdmin ? (finished
          ? `<button class="btn btn-ghost" onclick="reopenLevel()">Reopen this level</button>`
          : finishBlocker
            ? `<button class="btn btn-primary" disabled title="Finish ${nextLevelForFinish.toUpperCase()} for &quot;${escapeHtml(finishBlocker.name || '(untitled)')}&quot; first">Finish this level</button>`
            : `<button class="btn btn-primary" onclick="finishLevel()">Finish this level</button>`) : ''}
      </div>
      <div class="compare-build-columns">
        <div class="compare-col"><div class="compare-col-title">${escapeHtml(nameA)}</div>${renderCompareSourceColumn('a', editable)}</div>
        <div class="compare-col"><div class="compare-col-title">${escapeHtml(nameB)}</div>${renderCompareSourceColumn('b', editable)}</div>
        <div class="compare-col compare-col-target"><div class="compare-col-title">Target</div>${renderCompareTargetColumn(editable)}</div>
      </div>
    </div>
  </div>`;
}

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  if(state.screen==='loading'){
    app.innerHTML = state.profile
      ? `${renderHeader()}
        <div style="min-height:calc(100vh - 80px); display:flex; align-items:center; justify-content:center;">
          <div class="status-box"><div class="spinner"></div>Loading…</div>
        </div>`
      : `<div class="center-wrap"><div class="auth-card status-box"><div class="spinner"></div>Loading…</div></div>`;
  }
  else if(state.screen==='connection-error') app.innerHTML = `<div class="center-wrap"><div class="auth-card status-box">
      <div class="status-icon">⚠️</div>
      <h2>Connection failed</h2>
      <p class="sub">The tool couldn't connect to the database. Check your internet connection and try again.</p>
      ${state.authError ? `<div class="auth-error" style="text-align:left;">${escapeHtml(state.authError)}</div>` : ''}
      <button class="full-btn" onclick="state.screen='loading'; render(); init();">Try again</button>
    </div></div>`;
  else if(state.screen==='login') app.innerHTML = renderLogin();
  else if(state.screen==='signup') app.innerHTML = renderSignup();
  else if(state.screen==='forgot') app.innerHTML = renderForgot();
  else if(state.screen==='reset-password') app.innerHTML = renderResetPassword();
  else if(state.screen==='pending') app.innerHTML = renderPending();
  else if(state.screen==='rejected') app.innerHTML = renderRejected();
  else if(state.screen==='companies') app.innerHTML = renderCompanySelect();
  else if(state.screen==='admin') app.innerHTML = renderAdmin();
  else if(state.screen==='editor') renderEditor();
  else if(state.screen==='compare-picker') app.innerHTML = renderComparePicker();
  else if(state.screen==='compare') app.innerHTML = renderCompare();
}

function renderLogin(){
  return `<div class="center-wrap"><div class="auth-card">
    <h2>Log in</h2><p class="sub">Access to the Velogy Process Capture tool</p>
    ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
    <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="name@company.com"></div>
    <div class="field"><label>Password</label><input type="password" id="login-password"></div>
    <button class="full-btn" onclick="doSignIn(document.getElementById('login-email').value, document.getElementById('login-password').value)">Log in</button>
    <div style="text-align:center; margin-top:14px; display:flex; flex-direction:column; gap:6px;">
      <button class="link-btn" onclick="state.screen='signup'; state.authError=''; render();">No access yet? Request access</button>
      <button class="link-btn" onclick="state.screen='forgot'; state.authError=''; render();">Forgot password?</button>
    </div>
  </div></div>`;
}

function renderForgot(){
  return `<div class="center-wrap"><div class="auth-card">
    <h2>Forgot password</h2><p class="sub">Enter your email address and we'll send you a reset link.</p>
    ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
    <div class="field"><label>Email</label><input type="email" id="forgot-email" placeholder="name@company.com"></div>
    <button class="full-btn" onclick="doForgotPassword(document.getElementById('forgot-email').value)">Send link</button>
    <div style="text-align:center; margin-top:14px;">
      <button class="link-btn" onclick="state.screen='login'; state.authError=''; render();">Back to login</button>
    </div>
  </div></div>`;
}

function renderResetPassword(){
  return `<div class="center-wrap"><div class="auth-card">
    <h2>Set new password</h2><p class="sub">You got here via the email link — set a new password now.</p>
    ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
    <div class="field"><label>New password</label><input type="password" id="reset-password"></div>
    <button class="full-btn" onclick="doUpdatePassword(document.getElementById('reset-password').value)">Save password</button>
  </div></div>`;
}

function renderSignup(){
  return `<div class="center-wrap"><div class="auth-card">
    <h2>Request access</h2><p class="sub">An admin still needs to approve your request before you can get started.</p>
    ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
    <div class="field"><label>Name</label><input type="text" id="su-name" placeholder="Jane Doe"></div>
    <div class="field"><label>Email</label><input type="email" id="su-email" placeholder="name@company.com"></div>
    <div class="field"><label>Password</label><input type="password" id="su-password"></div>
    <button class="full-btn" onclick="doSignUp(document.getElementById('su-email').value, document.getElementById('su-password').value, document.getElementById('su-name').value)">Request access</button>
    <div style="text-align:center; margin-top:14px;">
      <button class="link-btn" onclick="state.screen='login'; state.authError=''; render();">Already have access? Log in</button>
    </div>
  </div></div>`;
}

function renderPending(){
  return `<div class="center-wrap"><div class="auth-card status-box">
    <div class="status-icon">⏳</div>
    <h2>Access requested</h2>
    <p class="sub">An admin still needs to approve your access. You'll get access to your department once approved.</p>
    <button class="btn btn-ghost" onclick="doSignOut()">Log out</button>
  </div></div>`;
}
function renderRejected(){
  return `<div class="center-wrap"><div class="auth-card status-box">
    <div class="status-icon">🚫</div>
    <h2>Access denied</h2>
    <p class="sub">Your access request wasn't approved. Contact your admin if you think this is a mistake.</p>
    <button class="btn btn-ghost" onclick="doSignOut()">Log out</button>
  </div></div>`;
}

function renderCompanySelect(){
  return `${renderHeader()}
  <div class="wrap">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; padding-left:16px;">
      <div style="font-weight:800; font-size:22px; color:var(--gray-900); letter-spacing:-.01em;">Overview</div>
      <div class="actions">
        ${state.profile.role==='admin' ? `<button class="btn btn-primary" onclick="openNewCompanyModal()">+ Add company</button>` : ''}
        <button class="btn btn-ghost" onclick="exportExcel()">⭳ Export all</button>
      </div>
    </div>
    <div class="dash-list">
      ${renderCompanyList()}
    </div>
  </div>
  ${state.showNewCompanyModal ? renderNewCompanyModal() : ''}
  ${state.companySettingsFor ? renderCompanySettingsModal() : ''}`;
}

function renderCompanyList(){
  if(state.companies.length===0) return `<div class="empty-note" style="text-align:center; padding:40px;">${state.profile.role==='admin' ? 'No companies yet — create the first one with "+ Add company".' : 'No companies yet.'}</div>`;
  return state.companies.map(c=>{
    const isExp = state.expandedCompanyId === c.id;
    return `
        <div class="dash-item" style="flex-direction:column; align-items:stretch; cursor:pointer;" onclick="toggleCompanyExpand('${c.id}')">
          <div style="display:flex; justify-content:space-between; align-items:center; width:100%; gap:10px; flex-wrap:wrap;">
            <h3 style="margin:0;">${escapeHtml(c.name)}</h3>
            <div class="actions" onclick="event.stopPropagation()">
              <button class="btn btn-ghost" onclick="exportExcel(null, '${c.id}')">⭳ Export</button>
              ${state.profile.role==='admin' ? `<button class="btn btn-ghost" onclick="openCompanySettings('${c.id}')">⋯</button>` : ''}
            </div>
          </div>
          ${isExp ? renderCompanyMegaCycles(c) : ''}
        </div>
      `;
  }).join('');
}

function renderCompanyMegaCycles(c){
  if(c.processes.length===0) return `<div class="empty-note" style="padding:10px 0 0;">No mega-cycles yet for this company.${state.profile.role==='admin' ? ' Add some via the ⋯ menu.' : ''}</div>`;
  return `<div style="margin-top:12px;" onclick="event.stopPropagation()">
      ${c.processes.map(p=>{
        return `<div class="sp-row" onclick="openEditor('${p.id}')">
          <span>${escapeHtml(p.l1_name)}</span>
          <span class="link-btn" style="pointer-events:none;">Open L2 ›</span>
        </div>`;
      }).join('')}
    </div>`;
}

function renderNewCompanyModal(){
  return `<div class="modal-overlay" onclick="if(event.target===this) closeNewCompanyModal()">
    <div class="modal" style="width:460px;">
      <h3>Add company</h3>
      <div class="field"><label>Company name</label><input type="text" id="nc-name" placeholder="e.g. Acme Corp"></div>
      <div class="field"><label>Mega-cycle processes to create</label>
        ${state.newCompanyProcessNames.map((name,idx)=>`
          <div class="row-input">
            <input type="text" value="${escapeHtml(name)}" oninput="onDraftProcessNameInput(${idx}, this.value)" placeholder="Mega-cycle name">
            <button class="icon-btn" onclick="removeDraftProcessName(${idx})">✕</button>
          </div>`).join('')}
        <button class="link-btn" onclick="addDraftProcessName()">+ add custom process</button>
      </div>
      <button class="full-btn" onclick="submitNewCompany(document.getElementById('nc-name').value)">Create</button>
      <button class="link-btn" style="margin-top:10px;" onclick="closeNewCompanyModal()">Cancel</button>
    </div>
  </div>`;
}

function renderCompanySettingsModal(){
  const c = state.companies.find(x=>x.id===state.companySettingsFor);
  if(!c) return '';
  return `<div class="modal-overlay" onclick="if(event.target===this) closeCompanySettings()">
    <div class="modal" style="width:460px;">
      <h3 style="margin-bottom:2px;">${escapeHtml(c.name)}</h3>
      <p style="margin:0 0 16px; font-size:12px; color:var(--gray-500); font-weight:600; text-transform:uppercase; letter-spacing:.03em;">Mega-cycles (${c.processes.length})</p>
      ${c.processes.length===0 ? `<div class="empty-note">No mega-cycles yet.</div>` : `<div style="display:flex; flex-direction:column; gap:2px;">${c.processes.map(p=>`
        <div class="row-input" style="padding:6px 0; border-bottom:1px solid var(--gray-100);">
          <span style="flex:1; font-size:13.5px;">${escapeHtml(p.l1_name)}</span>
          <button class="icon-btn" onclick="removeProcessFromCompany('${p.id}')">✕</button>
        </div>`).join('')}</div>`}
      <div class="row-input" style="margin-top:14px;">
        <input type="text" id="cs-new-process-name" placeholder="New mega-cycle name">
        <button class="btn btn-primary" style="flex-shrink:0;" onclick="addProcessToCompany('${c.id}', document.getElementById('cs-new-process-name').value); document.getElementById('cs-new-process-name').value='';">Add</button>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:22px; padding-top:14px; border-top:1px solid var(--gray-200);">
        <button class="link-btn" style="color:var(--red); padding:0;" onclick="deleteCompany('${c.id}')">Delete company</button>
        <button class="btn btn-ghost" onclick="closeCompanySettings()">Close</button>
      </div>
    </div>
  </div>`;
}

function renderAdmin(){
  return `${renderHeader()}
  <div class="wrap">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; padding-left:24px;">
      <div style="font-weight:800; font-size:22px; color:var(--gray-900); letter-spacing:-.01em;">Admin</div>
      <button class="btn btn-ghost" onclick="backToCompanies()">Home</button>
    </div>
    <div class="card">
      <div class="tabs">
        <div class="tab ${state.adminTab==='pending'?'active':''}" onclick="setAdminTab('pending')">Pending requests (${state.adminPending.length})</div>
        <div class="tab ${state.adminTab==='users'?'active':''}" onclick="setAdminTab('users')">Users</div>
        <div class="tab ${state.adminTab==='permissions'?'active':''}" onclick="setAdminTab('permissions')">Permissions</div>
        <div class="tab ${state.adminTab==='groups'?'active':''}" onclick="setAdminTab('groups')">Groups</div>
        <div class="tab ${state.adminTab==='audit'?'active':''}" onclick="setAdminTab('audit')">Audit Log</div>
        <div class="tab ${state.adminTab==='depts'?'active':''}" onclick="setAdminTab('depts')">Departments</div>
        <div class="tab ${state.adminTab==='stats'?'active':''}" onclick="setAdminTab('stats')">Statistics</div>
      </div>
      ${state.adminTab==='pending' ? renderAdminPending() : ''}
      ${state.adminTab==='users' ? renderAdminUsers() : ''}
      ${state.adminTab==='permissions' ? renderAdminPermissions() : ''}
      ${state.adminTab==='groups' ? renderAdminGroups() : ''}
      ${state.adminTab==='audit' ? renderAdminAuditLog() : ''}
      ${state.adminTab==='depts' ? renderAdminDepts() : ''}
      ${state.adminTab==='stats' ? renderAdminStatistics() : ''}
    </div>
  </div>
  ${state.groupMembersModalFor ? renderGroupMembersModal() : ''}`;
}
function renderAdminPending(){
  if(state.adminPending.length===0) return `<div class="empty-note">No pending requests.</div>`;
  return `<table class="admin-table"><thead><tr>
    <th>Name</th><th>Email</th><th>Role</th><th></th>
  </tr></thead><tbody>
  ${state.adminPending.map(u=>`
    <tr>
      <td>${escapeHtml(u.full_name || '—')}</td>
      <td>${escapeHtml(u.email || '')}</td>
      <td><select id="role-${u.id}"><option value="user">User</option><option value="admin">Admin</option></select></td>
      <td style="white-space:nowrap;">
        <button class="btn btn-primary" onclick="approveUser('${u.id}')">Approve</button>
        <button class="btn btn-danger" onclick="rejectUser('${u.id}')">Reject</button>
      </td>
    </tr>
  `).join('')}
  </tbody></table>`;
}
function renderAdminUsers(){
  if(state.adminUsers.length===0) return `<div class="empty-note">No users yet.</div>`;
  return `<table class="admin-table"><thead><tr>
    <th>Name</th><th>Email</th><th>Role</th><th>Status</th><th></th>
  </tr></thead><tbody>
  ${state.adminUsers.map(u=> u.is_protected ? `
    <tr>

function renderEditorBreadcrumb(){
  const p = state.editorProcess;
  const companyName = p.companies ? p.companies.name : '';
  const selSp = p.l2_locked ? (p.subprocesses.find(s=>s.id===state.editorSelectedSpId) || null) : null;
  const selStep = (selSp && selSp.l3_locked) ? (selSp.steps.find(s=>s.id===state.editorSelectedStepId) || null) : null;
  const selTask = (selStep && selStep.l4_locked) ? (selStep.tasks.find(t=>t.id===state.editorSelectedTaskId) || null) : null;
  const segments = [
    { label: companyName || '—', onClick: 'backToCompanies()' },
    { label: p.l1_name || '(untitled)', onClick: 'editorBreadcrumbTo(1)' }
  ];
  if(selSp) segments.push({ label: selSp.name || '(untitled)', onClick: 'editorBreadcrumbTo(2)' });
  if(selStep) segments.push({ label: selStep.text || '(untitled)', onClick: 'editorBreadcrumbTo(3)' });
  if(selTask) segments.push({ label: selTask.text || '(untitled)', onClick: 'editorBreadcrumbTo(4)' });
  return segments.map((seg, idx)=>{
    const isCurrent = idx === segments.length-1;
    const sep = idx>0 ? `<span class="compare-crumb-sep">›</span>` : '';
    return `${sep}<span class="compare-crumb ${isCurrent?'current':''}" onclick="${seg.onClick}">${escapeHtml(seg.label)}</span>`;
  }).join('');
}
function editorBreadcrumbTo(level){
  if(level<=1){ state.editorSelectedSpId=null; state.editorSelectedStepId=null; state.editorSelectedTaskId=null; }
  else if(level===2){ state.editorSelectedStepId=null; state.editorSelectedTaskId=null; }
  else if(level===3){ state.editorSelectedTaskId=null; }
  renderEditorLeftPanel();
  updateEditorTree();
  updateEditorBreadcrumb();
}
function updateEditorBreadcrumb(){
  const el = document.getElementById('editorBreadcrumb');
  if(el) el.innerHTML = renderEditorBreadcrumb();
}
function rowStatusHtml(isSel){
  const isViewer = !state.editorCanEdit;
  const pillClass = isSel ? 'active' : 'todo';
  const label = isSel
    ? (isViewer ? 'Currently viewing' : 'Currently editing')
    : (isViewer ? 'Click to view' : 'Click to edit');
  return `<div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
    <span class="row-pill ${pillClass}">${label}</span>
    <span class="row-chevron">›</span>

function renderEditorLeftPanel(){
  const p = state.editorProcess;
  const readOnly = !state.editorCanEdit;
  const selSp = p.l2_locked ? (p.subprocesses.find(s=>s.id===state.editorSelectedSpId) || null) : null;
  const selStep = (selSp && selSp.l3_locked) ? (selSp.steps.find(s=>s.id===state.editorSelectedStepId) || null) : null;
  const selTask = (selStep && selStep.l4_locked) ? (selStep.tasks.find(t=>t.id===state.editorSelectedTaskId) || null) : null;

  const c2 = p.l2_locked ? 'done' : 'active';
  const c3 = !p.l2_locked ? 'disabled' : (!selSp ? 'disabled' : (selSp.l3_locked ? 'done' : 'active'));
  const c4 = (!selSp || !selSp.l3_locked) ? 'disabled' : (!selStep ? 'disabled' : (selStep.l4_locked ? 'done' : 'active'));
  const c5 = (!selStep || selStep.l4_locked!==true) ? 'disabled' : (!selTask ? 'disabled' : (selTask.l5_locked ? 'done' : 'active'));

  let html = '';

  html += `<div class="card ${c2}">
    <div class="card-head" style="${p.l2_locked?'opacity:.5;':''}"><div class="card-head-left"><span class="card-title">Sub-processes <span class="card-level-label">(L2)</span></span></div>
    <span class="card-hint">short noun phrases</span></div>`;
  if(!p.l2_locked){
    if(p.subprocesses.length===0) html += `<div class="empty-note">No sub-processes yet.</div>`;
    p.subprocesses.forEach(sp=>{
      if(readOnly){
        html += `<div class="row-input"><span style="flex:1;">${escapeHtml(sp.name || '(untitled)')}</span></div>`;
      } else {
        html += `<div class="row-input">
          <input type="text" placeholder="e.g. Order management" value="${escapeHtml(sp.name)}" oninput="onSubName('${sp.id}', this.value)">
          <button class="icon-btn" onclick="removeSubprocess('${sp.id}')">✕</button>
        </div>`;
      }
    });
    if(!readOnly) html += `<button class="link-btn" onclick="addSubprocess()">+ add sub-process</button>`;
  } else {
    html += `<div class="card-desc" style="opacity:.5;">Click a sub-process to work on it in L3. Click it again to switch to another one.</div>`;
    p.subprocesses.forEach(sp=>{
      const isSel = sp.id === state.editorSelectedSpId;
      html += `<div class="sp-row ${isSel?'sel':''}" onclick="toggleSpSelection('${sp.id}')">
        <span>${escapeHtml(sp.name || '(untitled)')}</span>
        ${rowStatusHtml(isSel)}
      </div>`;
    });
  }
  if(!readOnly){
    html += p.l2_locked
      ? renderSavedRow('unlockL2()')
      : `<button id="l2-save-btn" class="lock-btn" ${!p.subprocesses.some(s=>s.name.trim()) ? 'disabled':''} onclick="lockL2()">Save L2 → go to L3</button>`;
  }
  html += `</div>`;

  /* ---------- L3: steps of the selected sub-process ---------- */
  html += `<div class="card ${c3}">
    <div class="card-head" style="${(selSp&&selSp.l3_locked)?'opacity:.5;':''}"><div class="card-head-left"><span class="card-title">Process steps <span class="card-level-label">(L3)</span></span></div>
    <span class="card-hint">verb first: "create...", "check..."</span></div>`;
  if(!p.l2_locked){ html += `<div class="empty-note">Save L2 first to add process steps.</div>`; }
  else if(p.subprocesses.length===0){ html += `<div class="empty-note">No sub-processes yet — add one in L2 above.</div>`; }
  else if(!selSp){ html += `<div class="empty-note">Click a sub-process in L2 above to add its steps here.</div>`; }
  else {
    html += `<div class="subblock-title" style="margin-bottom:10px;">${escapeHtml(selSp.name || '(untitled)')}</div>`;
    if(!selSp.l3_locked){
      if(selSp.steps.length===0) html += `<div class="empty-note">No steps yet.</div>`;
      selSp.steps.forEach(st=>{
        if(readOnly){
          html += `<div class="row-input"><span style="flex:1;">${escapeHtml(st.text || '(untitled)')}</span></div>`;
        } else {
          html += `<div class="row-input">
            <input type="text" placeholder="e.g. Create sales order" value="${escapeHtml(st.text)}" oninput="onStepText('${selSp.id}','${st.id}', this.value)">
            <button class="icon-btn" onclick="removeStep('${selSp.id}','${st.id}')">✕</button>
          </div>`;
        }
      });
      if(!readOnly){
        html += `<button class="link-btn" onclick="addStep('${selSp.id}')">+ add step</button>`;
        const hasAnyStep = selSp.steps.some(s=>s.text.trim());
        html += `<button id="l3-save-btn" class="lock-btn" ${!hasAnyStep ? 'disabled':''} onclick="lockL3ForSp('${selSp.id}')">Save L3 → select a step</button>`;
      }
    } else {
      html += `<div class="card-desc" style="opacity:.5;">Click a step to work on its tasks in L4.</div>`;
      selSp.steps.forEach(st=>{
        const isSel = st.id === state.editorSelectedStepId;
        html += `<div class="sp-row ${isSel?'sel':''}" onclick="toggleStepSelection('${st.id}')">
          <span>${escapeHtml(st.text)}</span>
          ${rowStatusHtml(isSel)}
        </div>`;
      });
      if(!readOnly) html += renderSavedRow(`unlockL3ForSp('${selSp.id}')`);
    }
  }
  html += `</div>`;

  /* ---------- L4: tasks of the selected step ---------- */
  html += `<div class="card ${c4}">
    <div class="card-head" style="${(selStep&&selStep.l4_locked)?'opacity:.5;':''}"><div class="card-head-left"><span class="card-title">Tasks <span class="card-level-label">(L4)</span></span></div>
    <span class="card-hint">verb + object, e.g. "Enter customer ID"</span></div>`;
  if(!selSp || !selSp.l3_locked){ html += `<div class="empty-note">Save L3 for a sub-process first, then select a step.</div>`; }
  else if(!selStep){ html += `<div class="empty-note">Click a step in L3 above to work on its tasks here.</div>`; }
  else {
    html += `<div class="subblock-title" style="margin-bottom:10px;">${escapeHtml(selStep.text)}</div>`;
    if(!selStep.l4_locked){
      if(selStep.tasks.length===0) html += `<div class="empty-note">No tasks yet.</div>`;
      selStep.tasks.forEach(task=>{
        if(readOnly){
          html += `<div class="row-input"><span style="flex:1;">${escapeHtml(task.text || '(untitled)')}</span></div>`;
        } else {
          html += `<div class="row-input">
            <input type="text" placeholder="e.g. Enter customer ID" value="${escapeHtml(task.text)}" oninput="onTaskText('${selSp.id}','${selStep.id}','${task.id}', this.value)">
            <button class="icon-btn" onclick="removeTask('${selSp.id}','${selStep.id}','${task.id}')">✕</button>
          </div>`;
        }
      });
      if(!readOnly){
        html += `<button class="link-btn" onclick="addTask('${selSp.id}','${selStep.id}')">+ add task</button>`;
        const hasAnyTask = selStep.tasks.some(t=>t.text.trim());
        html += `<button id="l4-save-btn" class="lock-btn" ${!hasAnyTask ? 'disabled':''} onclick="lockL4ForStep('${selSp.id}','${selStep.id}')">Save L4 → select a task for L5</button>`;
      }
    } else {
      html += `<div class="card-desc" style="opacity:.5;">Click a task to work on its work instructions in L5.</div>`;
      selStep.tasks.forEach(task=>{
        const isSel = task.id === state.editorSelectedTaskId;
        html += `<div class="sp-row ${isSel?'sel':''}" onclick="toggleTaskSelection('${task.id}')">
          <span>${escapeHtml(task.text)}</span>
          ${rowStatusHtml(isSel)}
        </div>`;
      });
      if(!readOnly) html += renderSavedRow(`unlockL4ForStep('${selSp.id}','${selStep.id}')`);
    }
  }
  html += `</div>`;

  /* ---------- L5: work instructions of the selected task ---------- */
  html += `<div class="card ${c5}">
    <div class="card-head" style="${(selTask&&selTask.l5_locked)?'opacity:.5;':''}"><div class="card-head-left"><span class="card-title">Work instructions <span class="card-level-label">(L5)</span></span></div>
    <span class="card-hint">System-specific: transaction codes, field names, key actions.</span></div>`;
  if(!selStep || !selStep.l4_locked){
    html += `<div class="empty-note">Save L4 for a step first, then select a task.</div>`;
  } else if(!selTask){
    html += `<div class="empty-note">Click a task in L4 above to add its work instructions here.</div>`;
  } else {
    html += `<div class="subblock-title" style="margin-bottom:10px;">${escapeHtml(selTask.text)}</div>`;
    if(selTask.work_instructions.length===0) html += `<div class="empty-note">No work instructions yet.</div>`;
    if(!selTask.l5_locked){
      selTask.work_instructions.forEach(wi=>{
        if(readOnly){
          html += `<div class="row-input"><span style="flex:1;">${escapeHtml(wi.text || '(untitled)')}</span></div>`;
        } else {
          html += `<div class="row-input">
            <input type="text" placeholder="e.g. Enter customer ID in transaction VA01" value="${escapeHtml(wi.text)}" oninput="onWI('${selSp.id}','${selStep.id}','${selTask.id}','${wi.id}', this.value)">
            <button class="icon-btn" onclick="removeWI('${selSp.id}','${selStep.id}','${selTask.id}','${wi.id}')">✕</button>
          </div>`;
        }
      });
      if(!readOnly){
        html += `<button class="link-btn" onclick="addWI('${selSp.id}','${selStep.id}','${selTask.id}')">+ add work instruction</button>`;
        const hasAnyWI = selTask.work_instructions.some(wi=>wi.text.trim());
        html += `<button id="l5-save-btn" class="lock-btn" ${!hasAnyWI ? 'disabled':''} onclick="lockL5ForTask('${selSp.id}','${selStep.id}','${selTask.id}')">Save L5</button>`;
      }
    } else {
      selTask.work_instructions.forEach(wi=>{
        html += `<div class="sp-row static"><span>${escapeHtml(wi.text) || '—'}</span></div>`;
      });
      if(!readOnly) html += renderSavedRow(`unlockL5ForTask('${selSp.id}','${selStep.id}','${selTask.id}')`);
    }
  }
  html += `</div>`;

  document.getElementById('editorLeft').innerHTML = html;
}


function updateEditorTree(){
  const p = state.editorProcess;
  const l1c = p.l1_name ? 1 : 0;
  const l2c = p.subprocesses.filter(s=>s.name.trim()).length;
  const l3c = p.subprocesses.reduce((n,s)=> n + s.steps.filter(st=>st.text.trim()).length, 0);
  const l4c = p.subprocesses.reduce((n,s)=> n + s.steps.reduce((m,st)=> m + st.tasks.filter(t=>t.text.trim()).length, 0), 0);
  const l5c = p.subprocesses.reduce((n,s)=> n + s.steps.reduce((m,st)=> m + st.tasks.reduce((k,t)=> k + t.work_instructions.filter(w=>w.text.trim()).length, 0), 0), 0);
  const statsEl = document.getElementById('stats');
  if(statsEl) statsEl.innerHTML = `
    <div class="stat"><div class="l">L1</div><div class="n">${l1c}</div></div>
    <div class="stat"><div class="l">L2</div><div class="n">${l2c}</div></div>
    <div class="stat"><div class="l">L3</div><div class="n">${l3c}</div></div>
    <div class="stat"><div class="l">L4</div><div class="n">${l4c}</div></div>
    <div class="stat"><div class="l">L5</div><div class="n">${l5c}</div></div>`;

  // The active editing scope is the deepest currently-selected item (mirrors
  // renderEditorLeftPanel's own selSp/selStep/selTask resolution). Everything
  // nested under it is also part of what's "currently being worked on", so
  // the highlight cascades down through its whole subtree — but never
  // upward to its parents/siblings, since those aren't part of this scope.
  // Each line still gets the highlight class independently (no shared
  // wrapper div spans a range) so cascading can never disturb another
  // line's own indentation/nesting.
  const selSp = p.l2_locked ? (p.subprocesses.find(s=>s.id===state.editorSelectedSpId) || null) : null;
  const selStep = (selSp && selSp.l3_locked) ? (selSp.steps.find(s=>s.id===state.editorSelectedStepId) || null) : null;
  const selTask = (selStep && selStep.l4_locked) ? (selStep.tasks.find(t=>t.id===state.editorSelectedTaskId) || null) : null;
  let highlightSpId = null, highlightStepId = null, highlightTaskId = null;
  if(selTask){ highlightTaskId = selTask.id; }
  else if(selStep){ highlightStepId = selStep.id; }
  else if(selSp){ highlightSpId = selSp.id; }

  let h = '';
  if(p.l1_name){
    h += `<div class="tree-process"><div class="tree-l1">${escapeHtml(p.l1_name)}</div>`;
    const namedSubprocesses = p.subprocesses.filter(sp=>sp.name.trim());
    namedSubprocesses.forEach((sp, spIdx)=>{
      const spOn = highlightSpId === sp.id;
      h += `<div class="tree-l2 ${spOn ? 'tree-highlight' : ''}">${escapeHtml(sp.name)}</div>`;
      sp.steps.forEach(st=>{
        if(!st.text.trim()) return;
        const stepOn = spOn || highlightStepId === st.id;
        h += `<div class="tree-l3 ${stepOn ? 'tree-highlight' : ''}">${escapeHtml(st.text)}</div>`;
        st.tasks.forEach(task=>{
          if(!task.text.trim()) return;
          const taskOn = stepOn || highlightTaskId === task.id;
          h += `<div class="tree-l4 ${taskOn ? 'tree-highlight' : ''}">${escapeHtml(task.text)}</div>`;
          task.work_instructions.forEach(wi=>{
            if(!wi.text.trim()) return;
            h += `<div class="tree-l5 ${taskOn ? 'tree-highlight' : ''}">${escapeHtml(wi.text)}</div>`;
          });
        });
      });
      if(spIdx < namedSubprocesses.length-1) h += `<div class="tree-l2-divider"></div>`;
    });
    h += `</div>`;
  }
  const treeEl = document.getElementById('treeBody');
  if(treeEl) treeEl.innerHTML = h.trim() ? h : `<div class="tree-empty">Nothing captured yet.</div>`;
}

init();
</script>
