<script>

const MEGA_CYCLES = [
  "Hire to Retire","Order to Cash","Procure to Pay","Record to Report",
  "Plan to Fulfill","Idea to Market","Acquire to Retire (Asset)","Issue to Resolution"
];

let state = {
  screen: 'loading',

  profile: null,

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= ERROR NOTIFICATIONS (top-right, auto-dismiss) ================= */
window.addEventListener('error', function(e){
  showError('Unexpected error: ' + e.message);
});
window.addEventListener('unhandledrejection', function(e){
  showError('Unexpected error: ' + (e.reason && e.reason.message ? e.reason.message : e.reason));
});
function showError(message){
  let stack = document.getElementById('error-toast-stack');
  if(!stack){
    stack = document.createElement('div');
    stack.id = 'error-toast-stack';
    stack.className = 'error-toast-stack';
    document.body.appendChild(stack);
  }
  const el = document.createElement('div');
  el.className = 'error-toast';
  const icon = document.createElement('span');
  icon.className = 'error-toast-icon';
  icon.textContent = '⚠';
  const msgEl = document.createElement('span');
  msgEl.className = 'error-toast-msg';
  msgEl.textContent = message;
  el.appendChild(icon); el.appendChild(msgEl);
  stack.prepend(el);
  requestAnimationFrame(()=> el.classList.add('show'));
  setTimeout(()=>{
    el.classList.remove('show');
    setTimeout(()=> el.remove(), 250);
  }, 5000);
}

/* ================= CUSTOM CONFIRM DIALOG ================= */
function showConfirm(message){
  return new Promise(resolve=>{
    const overlay = document.createElement('div');
    overlay.className = 'modal-overlay blur';
    const modal = document.createElement('div');
    modal.className = 'modal';
    const msgEl = document.createElement('p');
    msgEl.style.cssText = 'margin:0 0 20px; font-size:14px; color:var(--gray-900); line-height:1.5;';
    msgEl.textContent = message;
    const actions = document.createElement('div');
    actions.style.cssText = 'display:flex; gap:10px; justify-content:flex-end;';
    const cancelBtn = document.createElement('button');
    cancelBtn.className = 'btn btn-ghost';
    cancelBtn.textContent = 'Cancel';
    const confirmBtn = document.createElement('button');
    confirmBtn.className = 'btn btn-danger';
    confirmBtn.textContent = 'Confirm';
    actions.appendChild(cancelBtn); actions.appendChild(confirmBtn);
    modal.appendChild(msgEl); modal.appendChild(actions);
    overlay.appendChild(modal);
    function finish(result){ overlay.remove(); resolve(result); }
    overlay.addEventListener('click', e=>{ if(e.target === overlay) finish(false); });
    cancelBtn.addEventListener('click', ()=> finish(false));
    confirmBtn.addEventListener('click', ()=> finish(true));
    document.body.appendChild(overlay);
  });
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=> t.classList.remove('show'), 2400);
}
const debounceTimers = {};
function debounced(key, fn, delay=700){
  clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(fn, delay);
}
function sortTree(process){
  if(!process.subprocesses) return process;
  process.subprocesses.sort((a,b)=>a.position-b.position);
  process.subprocesses.forEach(sp=>{
    (sp.steps||[]).sort((a,b)=>a.position-b.position);
    sp.steps.forEach(st=>{
      (st.tasks||[]).sort((a,b)=>a.position-b.position);
      st.tasks.forEach(t=> (t.work_instructions||[]).sort((a,b)=>a.position-b.position));
    });
  });
  return process;
}

/* ================= INIT / AUTH ================= */
sb.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY'){
    state.screen = 'reset-password';
    render();
  }
});
async function init(){
  try {
    const { data: { session } } = await sb.auth.getSession();
    if(session){ state.user = session.user; await loadMyProfile(); }
    else state.screen = 'login';
  } catch(e){
    state.screen = 'connection-error';
    state.authError = String(e.message || e);
  }
  render();
}
async function loadMyProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.user.id).single();
  if(error || !data){ state.screen = 'login'; return; }
  state.profile = data;
  if(data.status === 'pending') state.screen = 'pending';
  else if(data.status === 'rejected') state.screen = 'rejected';
  else {
    state.screen = 'companies';
    await loadCompanies();
  }
}
async function doSignUp(email, password, fullName){
  state.authError = '';
  if(!email || !password){ state.authError = 'Email and password are required.'; render(); return; }
  const { error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name: fullName } } });
  if(error){ state.authError = error.message; render(); return; }
  toast('Access requested — an admin needs to approve you.');
  state.screen = 'login'; render();
}
async function doSignIn(email, password){
  state.authError = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ state.authError = error.message; render(); return; }
  state.user = data.user;
  await loadMyProfile();
  render();
}
async function doSignOut(){
  await sb.auth.signOut();
  state = { screen:'login', user:null, profile:null, departments:[],
    companies:[], expandedCompanyId:null, showNewCompanyModal:false, newCompanyProcessNames:[], companySettingsFor:null,
    editorProcess:null, editorSiblingProcesses:[], editingMegaCycle:false,
    editorSelectedSpId:null,
    editorSelectedStepId:null,
    editorSelectedTaskId:null,
    adminTab:'pending', adminPending:[], adminUsers:[],
    adminProfileCompanyRows:[], adminUcapMap:{}, adminAuditLog:[],
    accessTreeExpanded:{}, accessTreeSelected:null, addAccessLevel:'view', authError:'' };
  render();
}
async function doForgotPassword(email){
  state.authError = '';
  if(!email){ state.authError = 'Please enter your email address.'; render(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0] });
  if(error){ state.authError = error.message; render(); return; }
  toast('If that email is registered, a reset link has been sent.');
  state.screen = 'login'; render();
}
async function doUpdatePassword(newPassword){
  state.authError = '';
  if(!newPassword || newPassword.length < 6){ state.authError = 'At least 6 characters.'; render(); return; }
  const { error } = await sb.auth.updateUser({ password: newPassword });
  if(error){ state.authError = error.message; render(); return; }
  toast('Password changed — you are logged in.');
  const { data: { session } } = await sb.auth.getSession();
  state.user = session.user;
  await loadMyProfile();
  render();
}

async function deleteCompany(companyId){
  const c = state.companies.find(x=>x.id===companyId);
  if(!c) return;
  const hasData = (c.processes||[]).some(p=> (p.subprocesses||[]).length>0);
  const msg = c.processes.length===0
    ? `Delete "${c.name}"? This company has no mega-cycles yet.`
    : hasData
      ? `Delete "${c.name}"? This will permanently remove all ${c.processes.length} mega-cycle(s) and all captured data (sub-processes, steps, tasks, work instructions) inside them. This cannot be undone.`
      : `Delete "${c.name}"? This will permanently remove its ${c.processes.length} mega-cycle(s). This cannot be undone.`;
  if(!await showConfirm(msg)) return;
  const { error } = await sb.rpc('delete_company', { p_company_id: companyId });
  if(error){ showError(error.message); return; }
  state.companySettingsFor = null;
  state.expandedCompanyId = null;
  toast('Company deleted.');
  await loadCompanies(); render();
}
async function removeProcessFromCompany(processId){
  const { count } = await sb.from('subprocesses').select('id', { count:'exact', head:true }).eq('process_id', processId);
  const hasData = (count || 0) > 0;
  const msg = hasData
    ? 'This mega-cycle already has captured data (sub-processes, steps, tasks, or work instructions). Deleting it will permanently remove all of it. Continue?'
    : 'Delete this mega-cycle?';
  if(!await showConfirm(msg)) return;
  const { error } = await sb.from('processes').delete().eq('id', processId);
  if(error){ showError(error.message); return; }
  toast('Mega-cycle removed.');
  await loadCompanies(); render();
}

async function openEditor(processId){
  state.screen = 'loading'; render();
  const { data, error } = await sb.from('processes').select(`
      id, l1_name, company_id, department_id, created_by, l1_locked, l2_locked, l3_locked, l4_locked, created_at,
      companies ( name ),
      subprocesses ( id, name, position, l3_locked, l4_locked,
        steps ( id, text, position, l4_locked,
          tasks ( id, text, position, l5_locked,
            work_instructions ( id, transaction, field, tool, position )
          )
        )
      )
    `).eq('id', processId).single();
  if(error){ showError(error.message); state.screen = 'companies'; render(); return; }
  data.subprocesses = data.subprocesses || [];
  data.subprocesses.forEach(sp=>{
    sp.steps = sp.steps || [];
    sp.steps.forEach(st=>{
      st.tasks = st.tasks || [];
      st.tasks.forEach(t=> t.work_instructions = t.work_instructions || []);
    });
  });
  state.editorProcess = sortTree(data);
  state.editorSelectedSpId = (data.l2_locked && data.subprocesses.length>0) ? data.subprocesses[0].id : null;
  state.editorSelectedStepId = null;
  state.editorSelectedTaskId = null;
  state.editingMegaCycle = false;
  const { data: siblings } = await sb.from('processes').select('id, l1_name').eq('company_id', data.company_id).order('l1_name');
  state.editorSiblingProcesses = siblings || [];
  state.screen = 'editor';
  render();
}

/* --- text edits (debounced db write, no full re-render) --- */
function refreshSaveButton(btnId, enabled){
  const btn = document.getElementById(btnId);
  if(btn) btn.disabled = !enabled;
}
function reportSaveResult(error, data){
  if(error){
    console.error('Debounced save failed:', error);
    showError('Save failed: ' + error.message);
    return;
  }
  if(!data || data.length===0){
    console.warn('Debounced save affected 0 rows — check RLS policies.', data);
    showError('Save did not apply — check permissions.');
  }
}
function onSubName(spId, v){
  findSp(spId).name = v; updateEditorTree();
  refreshSaveButton('l2-save-btn', state.editorProcess.subprocesses.some(s=>s.name.trim()));
  debounced('sp-'+spId, async ()=>{
    const { data, error } = await sb.from('subprocesses').update({ name:v }).eq('id', spId).select();
    reportSaveResult(error, data);
  });
}
function onStepText(spId, stepId, v){
  findStep(spId, stepId).text = v; updateEditorTree();
  refreshSaveButton('l3-save-btn', findSp(spId).steps.some(s=>s.text.trim()));
  debounced('step-'+stepId, async ()=>{
    const { data, error } = await sb.from('steps').update({ text:v }).eq('id', stepId).select();
    reportSaveResult(error, data);
  });
}
function onTaskText(spId, stepId, taskId, v){
  findTask(spId, stepId, taskId).text = v; updateEditorTree();
  refreshSaveButton('l4-save-btn', findStep(spId, stepId).tasks.some(t=>t.text.trim()));
  debounced('task-'+taskId, async ()=>{
    const { data, error } = await sb.from('tasks').update({ text:v }).eq('id', taskId).select();
    reportSaveResult(error, data);
  });
}
function onWI(spId, stepId, taskId, wiId, field, v){
  const wi = findTask(spId, stepId, taskId).work_instructions.find(w=>w.id===wiId);
  wi[field] = v; updateEditorTree();
  refreshSaveButton('l5-save-btn', findTask(spId, stepId, taskId).work_instructions.some(w=>w.transaction.trim()||w.field.trim()||w.tool.trim()));
  debounced('wi-'+wiId+'-'+field, async ()=>{
    const { data, error } = await sb.from('work_instructions').update({ [field]:v }).eq('id', wiId).select();
    reportSaveResult(error, data);
  });
}

/* ================= EXCEL EXPORT ================= */
function formatExportTimestamp(d){
  const pad = n => String(n).padStart(2,'0');
  return `${pad(d.getFullYear()%100)}-${pad(d.getMonth()+1)}-${pad(d.getDate())}_${pad(d.getHours())}${pad(d.getMinutes())}`;
}
function sanitizeFilenamePart(s){
  return String(s||'').trim().replace(/\s+/g,'_').replace(/[^A-Za-z0-9_-]/g,'');
}
async function exportExcel(processIdOnly, companyIdOnly){
  let query = sb.from('processes').select(`
      l1_name, companies(name), departments(name),
      subprocesses ( name, position,
        steps ( text, position,
          tasks ( text, position,
            work_instructions ( transaction, field, tool, position )
          )
        )
      )
    `);
  if(processIdOnly) query = query.eq('id', processIdOnly);
  else if(companyIdOnly) query = query.eq('company_id', companyIdOnly);
  const { data, error } = await query;
  if(error){ showError(error.message); return; }
  const rows = [];
  let hasAnySubprocessName = false;
  (data||[]).forEach(proc=>{
    (proc.subprocesses||[]).sort((a,b)=>a.position-b.position).forEach(sp=>{
      if(!sp.name || !sp.name.trim()) return;
      hasAnySubprocessName = true;
      (sp.steps||[]).sort((a,b)=>a.position-b.position).forEach(st=>{
        if(!st.text || !st.text.trim()) return;
        const base = {
          "Company": proc.companies ? proc.companies.name : '',
          "Department": proc.departments ? proc.departments.name : '',
          "L1 Mega-cycle": proc.l1_name,
          "L2 Sub-process": sp.name,
          "L3 Process step": st.text
        };
        const tasks = (st.tasks||[]).sort((a,b)=>a.position-b.position);
        if(tasks.length===0){ rows.push({...base, "L4 Task":'', "L5 Transaction":'', "L5 Field":'', "L5 Tool":''}); return; }
        tasks.forEach(task=>{
          if(!task.text || !task.text.trim()) return;
          const wis = (task.work_instructions||[]).sort((a,b)=>a.position-b.position)
            .filter(wi=> wi.transaction || wi.field || wi.tool);
          if(wis.length===0){ rows.push({...base, "L4 Task":task.text, "L5 Transaction":'', "L5 Field":'', "L5 Tool":''}); return; }
          wis.forEach(wi=>{
            rows.push({...base, "L4 Task":task.text, "L5 Transaction":wi.transaction||'', "L5 Field":wi.field||'', "L5 Tool":wi.tool||''});
          });
        });
      });
    });
  });
  if(rows.length===0){
    toast(hasAnySubprocessName
      ? 'Add at least one L3 process step before you can export.'
      : 'Nothing to export yet — add some content first.');
    return;
  }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:16},{wch:16},{wch:20},{wch:20},{wch:26},{wch:26},{wch:16},{wch:16},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Process Capture");

  const ts = formatExportTimestamp(new Date());
  let filename = `Export_All_${ts}.xlsx`;
  if(processIdOnly){
    const company = sanitizeFilenamePart(data[0]?.companies?.name);
    const megaCycle = sanitizeFilenamePart(data[0]?.l1_name);
    if(company && megaCycle) filename = `Export_${company}_${megaCycle}_${ts}.xlsx`;
  } else if(companyIdOnly){
    const company = sanitizeFilenamePart(data[0]?.companies?.name);
    if(company) filename = `Export_${company}_${ts}.xlsx`;
  }

  XLSX.writeFile(wb, filename);
  toast('Exported.');
}

/* ================= ADMIN ================= */
async function openAdmin(){
  state.screen = 'loading'; render();
  await loadAdminData();
  state.screen = 'admin';
  render();
}
async function loadAdminData(){
  const { data: pending } = await sb.from('profiles').select('*').eq('status','pending').order('requested_at');
  state.adminPending = pending || [];
  const { data: all } = await sb.from('profiles').select('*').neq('status','pending').order('full_name');
  state.adminUsers = all || [];
  await loadDepartments();

  if(state.companies.length === 0) await loadCompanies();

  const { data: pcRows } = await sb.from('profile_companies').select('id, profile_id, company_id, level, scope');
  state.adminProfileCompanyRows = pcRows || [];

  const { data: ucapRows } = await sb.from('user_company_access_processes').select('user_company_access_id, process_id');
  const ucapMap = {};
  (ucapRows || []).forEach(row=>{
    if(!ucapMap[row.user_company_access_id]) ucapMap[row.user_company_access_id] = [];
    ucapMap[row.user_company_access_id].push(row.process_id);
  });
  state.adminUcapMap = ucapMap;

  const { data: auditRows } = await sb.from('audit_log')
    .select('id, actor_id, target_id, action, old_value, new_value, created_at')
    .order('created_at', { ascending:false })
    .limit(200);
  state.adminAuditLog = auditRows || [];
}
function findProfileLabel(profileId){
  const u = state.adminUsers.find(x=>x.id===profileId) || state.adminPending.find(x=>x.id===profileId);
  return u ? (u.full_name || u.email || profileId) : profileId;
}
async function logAudit(targetId, action, oldValue, newValue){
  await sb.from('audit_log').insert({
    actor_id: state.profile.id, target_id: targetId, action,
    old_value: oldValue==null ? null : String(oldValue),
    new_value: newValue==null ? null : String(newValue)
  });
}
function setAdminTab(tab){ state.adminTab = tab; render(); }
async function approveUser(id){
  const role = document.getElementById('role-'+id).value;
  const before = state.adminPending.find(u=>u.id===id);
  const { error } = await sb.from('profiles').update({ role, status:'approved' }).eq('id', id);
  if(error){ showError(error.message); return; }
  await logAudit(id, 'status_changed', before ? before.status : 'pending', 'approved');
  await logAudit(id, 'role_changed', before && before.role ? before.role : null, role);
  toast('User approved.');
  await loadAdminData(); render();
}
async function rejectUser(id){
  const before = state.adminPending.find(u=>u.id===id);
  const { error } = await sb.from('profiles').update({ status:'rejected' }).eq('id', id);
  if(error){ showError(error.message); return; }
  await logAudit(id, 'status_changed', before ? before.status : 'pending', 'rejected');
  toast('Request rejected.');
  await loadAdminData(); render();
}
async function updateUser(id){
  const role = document.getElementById('urole-'+id).value;
  const status = document.getElementById('ustatus-'+id).value;
  const before = state.adminUsers.find(u=>u.id===id);
  const { error } = await sb.from('profiles').update({ role, status }).eq('id', id);
  if(error){ showError(error.message); return; }
  if(before && before.role !== role) await logAudit(id, 'role_changed', before.role, role);
  if(before && before.status !== status) await logAudit(id, 'status_changed', before.status, status);
  toast('Saved.');
  await loadAdminData(); render();
}

/* ---------- Permissions tab: access tree (company -> mega-cycle) ---------- */
function companyLabel(companyId){
  const c = state.companies.find(x=>x.id===companyId);
  return c ? c.name : companyId;
}
function processLabel(companyId, processId){
  const c = state.companies.find(x=>x.id===companyId);
  const p = c && c.processes ? c.processes.find(x=>x.id===processId) : null;
  return p ? p.l1_name : processId;
}
function summarizeGrant(companyId, level, scope, processIds){
  const c = state.companies.find(x=>x.id===companyId);
  const levelLabel = level === 'edit' ? 'Editor' : 'Viewer';
  let scopeLabel;
  if(scope === 'specific'){
    const names = (processIds||[]).map(pid=>{
      const p = c && c.processes ? c.processes.find(x=>x.id===pid) : null;
      return p ? p.l1_name : pid;
    });
    scopeLabel = names.length ? `Specific (${names.join(', ')})` : 'Specific (none selected)';
  } else {
    scopeLabel = 'All mega-cycles';
  }
  return `${companyLabel(companyId)}: ${levelLabel} / ${scopeLabel}`;
}
function toggleAccessTreeCompany(companyId){
  state.accessTreeExpanded[companyId] = !state.accessTreeExpanded[companyId];
  render();
}
function selectAccessTreeNode(type, companyId, processId){
  state.accessTreeSelected = { type, companyId, processId: processId || null };
  state.addAccessLevel = 'view';
  render();
}
function getGrantsForSelectedNode(){
  const sel = state.accessTreeSelected;
  if(!sel) return [];
  const result = [];
  state.adminProfileCompanyRows.forEach(r=>{
    if(r.company_id !== sel.companyId) return;
    if(r.scope === 'all'){
      result.push({ row:r, profileId:r.profile_id, level:r.level });
    } else if(sel.type === 'process' && r.scope === 'specific'){
      const pids = state.adminUcapMap[r.id] || [];
      if(pids.includes(sel.processId)) result.push({ row:r, profileId:r.profile_id, level:r.level });
    }
  });
  return result;
}
async function removeNodeAccess(profileCompanyRowId){
  if(!await showConfirm('Remove this access?')) return;
  const row = state.adminProfileCompanyRows.find(r=>r.id===profileCompanyRowId);
  const { error } = await sb.from('profile_companies').delete().eq('id', profileCompanyRowId);
  if(error){ showError(error.message); return; }
  if(row){
    const pids = state.adminUcapMap[row.id] || [];
    await logAudit(row.profile_id, 'company_access_revoked', summarizeGrant(row.company_id, row.level, row.scope, pids), null);
  }
  toast('Access removed.');
  await loadAdminData(); render();
}
async function addAccessToSelectedNode(){
  const sel = state.accessTreeSelected;
  if(!sel) return;
  const userSelect = document.getElementById('add-access-user');
  const userId = userSelect ? userSelect.value : '';
  if(!userId){ toast('Please choose a user first.'); return; }
  // Read exactly once, right here — nothing else touches this value before
  // it's written below, for either the update or the insert path.
  const level = state.addAccessLevel;

  const existing = state.adminProfileCompanyRows.find(r=> r.profile_id===userId && r.company_id===sel.companyId);
  const existingPids = existing ? (state.adminUcapMap[existing.id] || []) : [];
  const beforeLabel = existing ? summarizeGrant(sel.companyId, existing.level, existing.scope, existingPids) : null;

  let newScope, newProcessIds;
  if(sel.type === 'company' || (existing && existing.scope === 'all')){
    newScope = 'all'; newProcessIds = [];
  } else {
    newScope = 'specific';
    newProcessIds = (existing && existing.scope==='specific')
      ? Array.from(new Set([...existingPids, sel.processId]))
      : [sel.processId];
  }

  let rowId;
  if(existing){
    const { error } = await sb.from('profile_companies').update({ level, scope:newScope }).eq('id', existing.id);
    if(error){ showError(error.message); return; }
    rowId = existing.id;
    const { error: delUcapErr } = await sb.from('user_company_access_processes').delete().eq('user_company_access_id', rowId);
    if(delUcapErr){ showError(delUcapErr.message); return; }
  } else {
    const { data, error } = await sb.from('profile_companies')
      .insert({ profile_id:userId, company_id:sel.companyId, level, scope:newScope }).select('id').single();
    if(error){ showError(error.message); return; }
    rowId = data.id;
  }
  if(newScope === 'specific' && newProcessIds.length){
    const { error: ucapErr } = await sb.from('user_company_access_processes')
      .insert(newProcessIds.map(pid=>({ user_company_access_id: rowId, process_id: pid })));
    if(ucapErr){ showError(ucapErr.message); return; }
  }

  await logAudit(userId, 'company_access_granted', beforeLabel, summarizeGrant(sel.companyId, level, newScope, newProcessIds));

  toast('Access added.');
  state.addAccessLevel = 'view';
  await loadAdminData(); render();
}

/* ================= RENDER ================= */
function render(){
  const app = document.getElementById('app');
  if(state.screen==='loading'){
    app.innerHTML = state.profile
      ? `${renderHeader()}
        <div style="min-height:calc(100vh - 80px); display:flex; align-items:center; justify-content:center;">
          <div class="status-box"><div class="spinner"></div>Loading…</div>
        </div>`
      : `<div class="center-wrap"><div class="auth-card status-box"><div class="spinner"></div>Loading…</div></div>`;
  }
  else if(state.screen==='connection-error') app.innerHTML = `<div class="center-wrap"><div class="auth-card status-box">
      <div class="status-icon">⚠️</div>
      <h2>Connection failed</h2>
      <p class="sub">The tool couldn't connect to the database. Check your internet connection and try again.</p>
      ${state.authError ? `<div class="auth-error" style="text-align:left;">${escapeHtml(state.authError)}</div>` : ''}
      <button class="full-btn" onclick="state.screen='loading'; render(); init();">Try again</button>
    </div></div>`;
  else if(state.screen==='login') app.innerHTML = renderLogin();
  else if(state.screen==='signup') app.innerHTML = renderSignup();
  else if(state.screen==='forgot') app.innerHTML = renderForgot();
  else if(state.screen==='reset-password') app.innerHTML = renderResetPassword();
  else if(state.screen==='pending') app.innerHTML = renderPending();
  else if(state.screen==='rejected') app.innerHTML = renderRejected();
  else if(state.screen==='companies') app.innerHTML = renderCompanySelect();
  else if(state.screen==='admin') app.innerHTML = renderAdmin();
  else if(state.screen==='editor') renderEditor();
}

function renderLogin(){
  return `<div class="center-wrap"><div class="auth-card">
    <h2>Log in</h2><p class="sub">Access to the Velogy Process Capture tool</p>
    ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
    <div class="field"><label>Email</label><input type="email" id="login-email" placeholder="name@company.com"></div>
    <div class="field"><label>Password</label><input type="password" id="login-password"></div>
    <button class="full-btn" onclick="doSignIn(document.getElementById('login-email').value, document.getElementById('login-password').value)">Log in</button>
    <div style="text-align:center; margin-top:14px; display:flex; flex-direction:column; gap:6px;">
      <button class="link-btn" onclick="state.screen='signup'; state.authError=''; render();">No access yet? Request access</button>
      <button class="link-btn" onclick="state.screen='forgot'; state.authError=''; render();">Forgot password?</button>
    </div>
  </div></div>`;
}

function renderForgot(){
  return `<div class="center-wrap"><div class="auth-card">
    <h2>Forgot password</h2><p class="sub">Enter your email address and we'll send you a reset link.</p>
    ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
    <div class="field"><label>Email</label><input type="email" id="forgot-email" placeholder="name@company.com"></div>
    <button class="full-btn" onclick="doForgotPassword(document.getElementById('forgot-email').value)">Send link</button>
    <div style="text-align:center; margin-top:14px;">
      <button class="link-btn" onclick="state.screen='login'; state.authError=''; render();">Back to login</button>
    </div>
  </div></div>`;
}

function renderResetPassword(){
  return `<div class="center-wrap"><div class="auth-card">
    <h2>Set new password</h2><p class="sub">You got here via the email link — set a new password now.</p>
    ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
    <div class="field"><label>New password</label><input type="password" id="reset-password"></div>
    <button class="full-btn" onclick="doUpdatePassword(document.getElementById('reset-password').value)">Save password</button>
  </div></div>`;
}

function renderSignup(){
  return `<div class="center-wrap"><div class="auth-card">
    <h2>Request access</h2><p class="sub">An admin still needs to approve your request before you can get started.</p>
    ${state.authError ? `<div class="auth-error">${escapeHtml(state.authError)}</div>` : ''}
    <div class="field"><label>Name</label><input type="text" id="su-name" placeholder="Jane Doe"></div>
    <div class="field"><label>Email</label><input type="email" id="su-email" placeholder="name@company.com"></div>
    <div class="field"><label>Password</label><input type="password" id="su-password"></div>
    <button class="full-btn" onclick="doSignUp(document.getElementById('su-email').value, document.getElementById('su-password').value, document.getElementById('su-name').value)">Request access</button>
    <div style="text-align:center; margin-top:14px;">
      <button class="link-btn" onclick="state.screen='login'; state.authError=''; render();">Already have access? Log in</button>
    </div>
  </div></div>`;
}

function renderPending(){
  return `<div class="center-wrap"><div class="auth-card status-box">
    <div class="status-icon">⏳</div>
    <h2>Access requested</h2>
    <p class="sub">An admin still needs to approve your access. You'll get access to your department once approved.</p>
    <button class="btn btn-ghost" onclick="doSignOut()">Log out</button>
  </div></div>`;
}
function renderRejected(){
  return `<div class="center-wrap"><div class="auth-card status-box">
    <div class="status-icon">🚫</div>
    <h2>Access denied</h2>
    <p class="sub">Your access request wasn't approved. Contact your admin if you think this is a mistake.</p>
    <button class="btn btn-ghost" onclick="doSignOut()">Log out</button>
  </div></div>`;
}

function renderCompanySelect(){
  return `${renderHeader()}
  <div class="wrap">
    <div style="display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; flex-wrap:wrap; gap:12px; padding-left:16px;">
      <div style="font-weight:800; font-size:22px; color:var(--gray-900); letter-spacing:-.01em;">Companies</div>
      <div class="actions">
        ${state.profile.role==='admin' ? `<button class="btn btn-dark" onclick="openNewCompanyModal()">+ Add company</button>` : ''}
        <button class="btn btn-ghost" onclick="exportExcel()">⭳ Export all</button>
      </div>
    </div>
    <div class="dash-list">
      ${renderCompanyList()}
    </div>
  </div>
  ${state.showNewCompanyModal ? renderNewCompanyModal() : ''}
  ${state.companySettingsFor ? renderCompanySettingsModal() : ''}`;
}

function renderCompanyList(){
  if(state.companies.length===0) return `<div class="empty-note" style="text-align:center; padding:40px;">${state.profile.role==='admin' ? 'No companies yet — create the first one with "+ Add company".' : 'No companies yet.'}</div>`;
  return state.companies.map(c=>{
    const isExp = state.expandedCompanyId === c.id;
    return `
        <div class="dash-item" style="flex-direction:column; align-items:stretch; cursor:pointer;" onclick="toggleCompanyExpand('${c.id}')">
          <div style="display:flex; justify-content:space-between; align-items:center; width:100%; gap:10px; flex-wrap:wrap;">
            <h3 style="margin:0;">${escapeHtml(c.name)}</h3>
            <div class="actions" onclick="event.stopPropagation()">
              <button class="btn btn-ghost" onclick="exportExcel(null, '${c.id}')">⭳ Export</button>
              ${state.profile.role==='admin' ? `<button class="btn btn-ghost" onclick="openCompanySettings('${c.id}')">⋯</button>` : ''}
            </div>
          </div>

function rowStatusHtml(isSel){
  const isViewer = state.profile.role === 'viewer';
  const pillClass = isSel ? 'active' : 'todo';
  const label = isSel
    ? (isViewer ? 'Currently viewing' : 'Currently editing')
    : (isViewer ? 'Click to view' : 'Click to edit');
  return `<div style="display:flex; align-items:center; gap:10px; flex-shrink:0;">
    <span class="row-pill ${pillClass}">${label}</span>
    <span class="row-chevron">›</span>
  </div>`;
}

function renderEditorLeftPanel(){
  const p = state.editorProcess;
  const readOnly = state.profile.role === 'viewer';
  const selSp = p.l2_locked ? (p.subprocesses.find(s=>s.id===state.editorSelectedSpId) || null) : null;
  const selStep = (selSp && selSp.l3_locked) ? (selSp.steps.find(s=>s.id===state.editorSelectedStepId) || null) : null;
  const selTask = (selStep && selStep.l4_locked) ? (selStep.tasks.find(t=>t.id===state.editorSelectedTaskId) || null) : null;

  const c2 = p.l2_locked ? 'done' : 'active';
  const c3 = !p.l2_locked ? 'disabled' : (!selSp ? 'disabled' : (selSp.l3_locked ? 'done' : 'active'));
  const c4 = (!selSp || !selSp.l3_locked) ? 'disabled' : (!selStep ? 'disabled' : (selStep.l4_locked ? 'done' : 'active'));
  const c5 = (!selStep || selStep.l4_locked!==true) ? 'disabled' : (!selTask ? 'disabled' : (selTask.l5_locked ? 'done' : 'active'));

  let html = '';

  html += `<div class="card ${c2}">
    <div class="card-head" style="${p.l2_locked?'opacity:.5;':''}"><div class="card-head-left"><span class="badge badge-purple">L2</span><span class="card-title">Sub-processes</span></div>
    <span class="card-hint">short noun phrases</span></div>`;
  if(!p.l2_locked){
    if(p.subprocesses.length===0) html += `<div class="empty-note">No sub-processes yet.</div>`;
    p.subprocesses.forEach(sp=>{
      if(readOnly){
        html += `<div class="row-input"><span style="flex:1;">${escapeHtml(sp.name || '(untitled)')}</span></div>`;
      } else {
        html += `<div class="row-input">
          <input type="text" placeholder="e.g. Order management" value="${escapeHtml(sp.name)}" oninput="onSubName('${sp.id}', this.value)">
          <button class="icon-btn" onclick="removeSubprocess('${sp.id}')">✕</button>
        </div>`;
      }
    });
    if(!readOnly) html += `<button class="link-btn" onclick="addSubprocess()">+ add sub-process</button>`;
  } else {
    html += `<div class="card-desc" style="opacity:.5;">Click a sub-process to work on it in L3. Click it again to switch to another one.</div>`;
    p.subprocesses.forEach(sp=>{
      const isSel = sp.id === state.editorSelectedSpId;
      html += `<div class="sp-row ${isSel?'sel':''}" onclick="toggleSpSelection('${sp.id}')">
        <span>${escapeHtml(sp.name || '(untitled)')}</span>
        ${rowStatusHtml(isSel)}
      </div>`;
    });
  }
  if(!readOnly){
    html += p.l2_locked
      ? renderSavedRow('unlockL2()')
      : `<button id="l2-save-btn" class="lock-btn" ${!p.subprocesses.some(s=>s.name.trim()) ? 'disabled':''} onclick="lockL2()">Save L2 → go to L3</button>`;
  }
  html += `</div>`;

  /* ---------- L3: steps of the selected sub-process ---------- */
  html += `<div class="card ${c3}">
    <div class="card-head" style="${(selSp&&selSp.l3_locked)?'opacity:.5;':''}"><div class="card-head-left"><span class="badge ${p.l2_locked?'badge-navy':'badge-gray'}">L3</span><span class="card-title">Process steps</span></div>
    <span class="card-hint">verb first: "create...", "check..."</span></div>`;
  if(!p.l2_locked){ html += `<div class="empty-note">Save L2 first to add process steps.</div>`; }
  else if(p.subprocesses.length===0){ html += `<div class="empty-note">No sub-processes yet — add one in L2 above.</div>`; }
  else if(!selSp){ html += `<div class="empty-note">Click a sub-process in L2 above to add its steps here.</div>`; }
  else {
    html += `<div class="subblock-title" style="margin-bottom:10px;">${escapeHtml(selSp.name || '(untitled)')}</div>`;
    if(!selSp.l3_locked){
      if(selSp.steps.length===0) html += `<div class="empty-note">No steps yet.</div>`;
      selSp.steps.forEach(st=>{
        if(readOnly){
          html += `<div class="row-input"><span style="flex:1;">${escapeHtml(st.text || '(untitled)')}</span></div>`;
        } else {
          html += `<div class="row-input">
            <input type="text" placeholder="e.g. Create sales order" value="${escapeHtml(st.text)}" oninput="onStepText('${selSp.id}','${st.id}', this.value)">
            <button class="icon-btn" onclick="removeStep('${selSp.id}','${st.id}')">✕</button>
          </div>`;
        }
      });
      if(!readOnly){
        html += `<button class="link-btn" onclick="addStep('${selSp.id}')">+ add step</button>`;
        const hasAnyStep = selSp.steps.some(s=>s.text.trim());
        html += `<button id="l3-save-btn" class="lock-btn" ${!hasAnyStep ? 'disabled':''} onclick="lockL3ForSp('${selSp.id}')">Save L3 → select a step</button>`;
      }
    } else {
      html += `<div class="card-desc" style="opacity:.5;">Click a step to work on its tasks in L4.</div>`;
      selSp.steps.forEach(st=>{
        const isSel = st.id === state.editorSelectedStepId;
        html += `<div class="sp-row ${isSel?'sel':''}" onclick="toggleStepSelection('${st.id}')">
          <span>${escapeHtml(st.text)}</span>
          ${rowStatusHtml(isSel)}
        </div>`;
      });
      if(!readOnly) html += renderSavedRow(`unlockL3ForSp('${selSp.id}')`);
    }
  }
  html += `</div>`;

  /* ---------- L4: tasks of the selected step ---------- */
  html += `<div class="card ${c4}">
    <div class="card-head" style="${(selStep&&selStep.l4_locked)?'opacity:.5;':''}"><div class="card-head-left"><span class="badge ${(selSp&&selSp.l3_locked)?'badge-navy':'badge-gray'}">L4</span><span class="card-title">Tasks</span></div>
    <span class="card-hint">verb + object, e.g. "Enter customer ID"</span></div>`;
  if(!selSp || !selSp.l3_locked){ html += `<div class="empty-note">Save L3 for a sub-process first, then select a step.</div>`; }
  else if(!selStep){ html += `<div class="empty-note">Click a step in L3 above to work on its tasks here.</div>`; }
  else {
    html += `<div class="subblock-title" style="margin-bottom:10px;">${escapeHtml(selStep.text)}</div>`;
    if(!selStep.l4_locked){
      if(selStep.tasks.length===0) html += `<div class="empty-note">No tasks yet.</div>`;
      selStep.tasks.forEach(task=>{
        if(readOnly){
          html += `<div class="row-input"><span style="flex:1;">${escapeHtml(task.text || '(untitled)')}</span></div>`;
        } else {
          html += `<div class="row-input">
            <input type="text" placeholder="e.g. Enter customer ID" value="${escapeHtml(task.text)}" oninput="onTaskText('${selSp.id}','${selStep.id}','${task.id}', this.value)">
            <button class="icon-btn" onclick="removeTask('${selSp.id}','${selStep.id}','${task.id}')">✕</button>
          </div>`;
        }
      });
      if(!readOnly){
        html += `<button class="link-btn" onclick="addTask('${selSp.id}','${selStep.id}')">+ add task</button>`;
        const hasAnyTask = selStep.tasks.some(t=>t.text.trim());
        html += `<button id="l4-save-btn" class="lock-btn" ${!hasAnyTask ? 'disabled':''} onclick="lockL4ForStep('${selSp.id}','${selStep.id}')">Save L4 → select a task for L5</button>`;
      }
    } else {
      html += `<div class="card-desc" style="opacity:.5;">Click a task to work on its work instructions in L5.</div>`;
      selStep.tasks.forEach(task=>{
        const isSel = task.id === state.editorSelectedTaskId;
        html += `<div class="sp-row ${isSel?'sel':''}" onclick="toggleTaskSelection('${task.id}')">
          <span>${escapeHtml(task.text)}</span>
          ${rowStatusHtml(isSel)}
        </div>`;
      });
      if(!readOnly) html += renderSavedRow(`unlockL4ForStep('${selSp.id}','${selStep.id}')`);
    }
  }
  html += `</div>`;

  /* ---------- L5: work instructions of the selected task ---------- */
  html += `<div class="card ${c5}">
    <div class="card-head" style="${(selTask&&selTask.l5_locked)?'opacity:.5;':''}"><div class="card-head-left"><span class="badge ${selTask?'badge-green':'badge-gray'}">L5</span><span class="card-title">Work instructions</span></div>
    <span class="card-hint">system-specific: transaction, field, tool</span></div>`;
  if(!selStep || !selStep.l4_locked){
    html += `<div class="empty-note">Save L4 for a step first, then select a task.</div>`;
  } else if(!selTask){
    html += `<div class="empty-note">Click a task in L4 above to add its work instructions here.</div>`;
  } else {
    html += `<div class="subblock-title" style="margin-bottom:10px;">${escapeHtml(selTask.text)}</div>`;
    if(selTask.work_instructions.length===0) html += `<div class="empty-note">No work instructions yet.</div>`;
    if(!selTask.l5_locked){
      selTask.work_instructions.forEach(wi=>{
        if(readOnly){
          html += `<div class="wi-view">
            <div class="wi-view-grid">
              <div><div class="wi-view-label">TRANSACTION</div><div class="wi-view-value">${escapeHtml(wi.transaction) || '—'}</div></div>
              <div><div class="wi-view-label">FIELD</div><div class="wi-view-value">${escapeHtml(wi.field) || '—'}</div></div>
              <div><div class="wi-view-label">TOOL</div><div class="wi-view-value">${escapeHtml(wi.tool) || '—'}</div></div>
            </div>
          </div>`;
        } else {
          html += `<div class="wi-row">
            <input type="text" placeholder="Transaction" value="${escapeHtml(wi.transaction)}" oninput="onWI('${selSp.id}','${selStep.id}','${selTask.id}','${wi.id}','transaction', this.value)">
            <input type="text" placeholder="Field" value="${escapeHtml(wi.field)}" oninput="onWI('${selSp.id}','${selStep.id}','${selTask.id}','${wi.id}','field', this.value)">
            <input type="text" placeholder="Tool" value="${escapeHtml(wi.tool)}" oninput="onWI('${selSp.id}','${selStep.id}','${selTask.id}','${wi.id}','tool', this.value)">
            <button class="icon-btn" onclick="removeWI('${selSp.id}','${selStep.id}','${selTask.id}','${wi.id}')">✕</button>
          </div>`;
        }
      });
      if(!readOnly){
        html += `<button class="link-btn" onclick="addWI('${selSp.id}','${selStep.id}','${selTask.id}')">+ add work instruction</button>`;
        const hasAnyWI = selTask.work_instructions.some(wi=>wi.transaction.trim()||wi.field.trim()||wi.tool.trim());
        html += `<button id="l5-save-btn" class="lock-btn" ${!hasAnyWI ? 'disabled':''} onclick="lockL5ForTask('${selSp.id}','${selStep.id}','${selTask.id}')">Save L5</button>`;
      }
    } else {
      selTask.work_instructions.forEach(wi=>{
        html += `<div class="wi-view">
          <div class="wi-view-grid">
            <div><div class="wi-view-label">TRANSACTION</div><div class="wi-view-value">${escapeHtml(wi.transaction) || '—'}</div></div>
            <div><div class="wi-view-label">FIELD</div><div class="wi-view-value">${escapeHtml(wi.field) || '—'}</div></div>
            <div><div class="wi-view-label">TOOL</div><div class="wi-view-value">${escapeHtml(wi.tool) || '—'}</div></div>
          </div>
        </div>`;
      });
      if(!readOnly) html += renderSavedRow(`unlockL5ForTask('${selSp.id}','${selStep.id}','${selTask.id}')`);
    }
  }
  html += `</div>`;

  document.getElementById('editorLeft').innerHTML = html;
}


function updateEditorTree(){
  const p = state.editorProcess;
  const l1c = p.l1_name ? 1 : 0;
  const l2c = p.subprocesses.filter(s=>s.name.trim()).length;
  const l3c = p.subprocesses.reduce((n,s)=> n + s.steps.filter(st=>st.text.trim()).length, 0);
  const l4c = p.subprocesses.reduce((n,s)=> n + s.steps.reduce((m,st)=> m + st.tasks.filter(t=>t.text.trim()).length, 0), 0);
  const l5c = p.subprocesses.reduce((n,s)=> n + s.steps.reduce((m,st)=> m + st.tasks.reduce((k,t)=> k + t.work_instructions.filter(w=>w.transaction.trim()||w.field.trim()||w.tool.trim()).length, 0), 0), 0);
  const statsEl = document.getElementById('stats');
  if(statsEl) statsEl.innerHTML = `
    <div class="stat"><div class="l">L1</div><div class="n">${l1c}</div></div>
    <div class="stat"><div class="l">L2</div><div class="n">${l2c}</div></div>
    <div class="stat"><div class="l">L3</div><div class="n">${l3c}</div></div>
    <div class="stat"><div class="l">L4</div><div class="n">${l4c}</div></div>
    <div class="stat"><div class="l">L5</div><div class="n">${l5c}</div></div>`;

  let h = '';
  if(p.l1_name){
    h += `<div class="tree-process"><div class="tree-l1">${escapeHtml(p.l1_name)}</div>`;
    const namedSubprocesses = p.subprocesses.filter(sp=>sp.name.trim());
    namedSubprocesses.forEach((sp, spIdx)=>{
      h += `<div class="tree-l2">${escapeHtml(sp.name)}</div>`;
      sp.steps.forEach(st=>{
        if(!st.text.trim()) return;
        h += `<div class="tree-l3">${escapeHtml(st.text)}</div>`;
        st.tasks.forEach(task=>{
          if(!task.text.trim()) return;
          h += `<div class="tree-l4">${escapeHtml(task.text)}</div>`;
          task.work_instructions.forEach(wi=>{
            if(!wi.transaction.trim() && !wi.field.trim() && !wi.tool.trim()) return;
            const parts = [wi.transaction, wi.field, wi.tool].filter(Boolean).map(escapeHtml).join(' · ');
            h += `<div class="tree-l5">${parts}</div>`;
          });
        });
      });
      if(spIdx < namedSubprocesses.length-1) h += `<div class="tree-l2-divider"></div>`;
    });
    h += `</div>`;
  }
  const treeEl = document.getElementById('treeBody');
  if(treeEl) treeEl.innerHTML = h.trim() ? h : `<div class="tree-empty">Nothing captured yet.</div>`;
}

init();
</script>
</body>
</html>
