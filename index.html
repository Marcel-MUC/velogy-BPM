<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Velogy — Process Capture</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<style>
  :root{
    --violet: #7c3aed; --violet-dark: #6d28d9; --violet-light: #ede9fe;
    --navy: #312e81; --green: #16a34a; --green-bg: #f0fdf4; --green-border: #bbf7d0;
    --gray-50: #f7f7f9; --gray-100: #f1f1f4; --gray-200: #e5e5ea; --gray-400: #9ca3af;
    --gray-500: #6b7280; --gray-700: #374151; --gray-900: #111827; --red: #dc2626; --red-bg:#fef2f2;
  }
  *{box-sizing:border-box;}
  body{ margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Roboto,Helvetica,Arial,sans-serif;
    background:var(--gray-50); color:var(--gray-900); padding:20px; }
  .wrap{ max-width:1400px; margin:0 auto; }
  .header{ background:#fff; border:1px solid var(--gray-200); border-radius:14px; padding:18px 24px;
    display:flex; justify-content:space-between; align-items:center; margin-bottom:16px; flex-wrap:wrap; gap:12px; }
  .brand{ display:flex; align-items:center; gap:12px; }
  .logo{ width:34px; height:34px; border-radius:8px; background:linear-gradient(135deg,var(--violet),var(--violet-dark));
    display:flex; align-items:center; justify-content:center; color:#fff; font-size:16px; flex-shrink:0; }
  .brand h1{ margin:0; font-size:19px; font-weight:700; }
  .brand p{ margin:2px 0 0; font-size:12.5px; color:var(--gray-500); }
  .actions{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; }
  .btn{ border-radius:8px; padding:9px 14px; font-size:13.5px; font-weight:600; cursor:pointer;
    border:1px solid transparent; transition:all .12s ease; white-space:nowrap; }
  .btn:disabled{ opacity:.5; cursor:not-allowed; }
  .btn-ghost{ background:#fff; border-color:var(--gray-200); color:var(--gray-700); }
  .btn-ghost:hover:not(:disabled){ background:var(--gray-100); }
  .btn-primary{ background:var(--violet); color:#fff; }
  .btn-primary:hover:not(:disabled){ background:var(--violet-dark); }
  .btn-danger{ background:#fff; border-color:var(--red); color:var(--red); }
  .btn-danger:hover:not(:disabled){ background:var(--red-bg); }
  .pill{ font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; }
  .pill-admin{ background:var(--violet-light); color:var(--violet-dark); }
  .pill-owner{ background:#dbeafe; color:#1e40af; }
  .pill-viewer{ background:var(--gray-100); color:var(--gray-700); }

  .center-wrap{ max-width:420px; margin:80px auto; }
  .auth-card{ background:#fff; border:1px solid var(--gray-200); border-radius:14px; padding:32px; }
  .auth-card h2{ margin:0 0 4px; font-size:20px; }
  .auth-card p.sub{ margin:0 0 20px; color:var(--gray-500); font-size:13.5px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:12.5px; font-weight:600; color:var(--gray-700); margin-bottom:5px; }
  select,input[type=text],input[type=email],input[type=password]{
    width:100%; padding:9px 11px; border:1px solid var(--gray-200); border-radius:8px;
    font-size:13.5px; background:#fff; color:var(--gray-900); }
  select:disabled,input:disabled{ background:var(--gray-100); color:var(--gray-500); }
  select:focus,input:focus{ outline:none; border-color:var(--violet); box-shadow:0 0 0 3px var(--violet-light); }
  .full-btn{ width:100%; margin-top:6px; padding:10px; border:none; border-radius:8px; background:var(--violet);
    color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; }
  .full-btn:hover{ background:var(--violet-dark); }
  .link-btn{ background:none; border:none; color:var(--violet); font-weight:600; font-size:12.5px; cursor:pointer; padding:4px 0; }
  .link-btn:hover{ text-decoration:underline; }
  .auth-error{ background:var(--red-bg); color:var(--red); padding:9px 12px; border-radius:8px; font-size:12.5px; margin-bottom:14px; }
  .status-box{ text-align:center; padding:40px 20px; }
  .status-icon{ font-size:38px; margin-bottom:10px; }
  .spinner{ width:28px; height:28px; border:3px solid var(--violet-light); border-top-color:var(--violet);
    border-radius:50%; margin:0 auto 14px; animation:spin .8s linear infinite; }
  @keyframes spin{ to{ transform:rotate(360deg); } }

  .grid{ display:grid; grid-template-columns:1fr 1fr; gap:16px; align-items:start; }
  @media (max-width:980px){ .grid{ grid-template-columns:1fr; } }
  .card{ background:#fff; border:1px solid var(--gray-200); border-radius:14px; padding:18px 20px;
    margin-bottom:14px; transition:border-color .15s ease,background .15s ease; }
  .card.active{ border-color:var(--violet); box-shadow:0 0 0 3px var(--violet-light); }
  .card.done{ border-color:var(--gray-200); }
  .card.disabled{ opacity:.55; }
  .card-head{ display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; gap:10px; }
  .card-head-left{ display:flex; align-items:center; gap:10px; }
  .badge{ font-size:11.5px; font-weight:700; color:#fff; padding:3px 8px; border-radius:6px; }
  .badge-purple{ background:var(--violet); } .badge-navy{ background:var(--navy); }
  .badge-gray{ background:var(--gray-400); } .badge-green{ background:var(--green); }
  .card-title{ font-weight:700; font-size:14.5px; }
  .card-hint{ font-size:12px; color:var(--gray-500); font-style:italic; }
  .lock-btn{ width:100%; margin-top:10px; padding:10px; border:none; border-radius:8px; background:var(--violet);
    color:#fff; font-weight:700; font-size:13.5px; cursor:pointer; }
  .lock-btn:disabled{ background:var(--violet-light); color:var(--violet); cursor:not-allowed; }
  .lock-btn.done-btn{ background:var(--green); }
  .saved-indicator{ flex:1; padding:9px 14px; border:1px solid var(--green-border); border-radius:8px;
    background:var(--green-bg); color:var(--green); font-weight:600; font-size:13.5px;
    display:flex; align-items:center; justify-content:center; gap:6px; }
  .row-input{ display:flex; gap:8px; margin-bottom:8px; align-items:center; }
  .row-input input{ flex:1; }
  .icon-btn{ background:none; border:none; color:var(--red); font-size:15px; cursor:pointer; width:26px; flex-shrink:0; }
  .empty-note{ color:var(--gray-400); font-size:13px; font-style:italic; padding:6px 0; }
  .sp-row{ padding:10px 14px; border-radius:8px; margin-bottom:8px; cursor:pointer; font-size:13.5px; font-weight:600;
    border:1px solid var(--gray-200); background:var(--gray-100); color:var(--gray-500); transition:all .12s ease;
    display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .sp-row:hover:not(.sel){ background:var(--gray-200); color:var(--gray-700); }
  .sp-row.sel{ background:var(--gray-700); border-color:var(--gray-700); color:#fff; }
  .company-process-row{ background:#fff; }
  .sp-row.company-process-row:hover{ background:var(--violet-light); }
  .subblock{ border-left:3px solid var(--violet-light); padding-left:12px; margin-bottom:14px; }
  .subblock-title{ font-weight:700; font-size:13px; color:var(--navy); margin-bottom:8px; }
  .step-line{ display:flex; align-items:center; gap:8px; padding:7px 0; border-bottom:1px dashed var(--gray-200); }
  .step-line:last-child{ border-bottom:none; }
  .step-text{ flex:1; font-size:13px; }
  .task-block{ background:var(--gray-50); border:1px solid var(--gray-200); border-radius:10px; padding:10px 12px; margin-bottom:10px; }
  .task-block-header{ font-size:12px; color:var(--gray-500); margin-bottom:6px; }
  .wi-row{ display:grid; grid-template-columns:1fr 1fr 1fr 26px; gap:6px; margin-top:6px; }
  .wi-row input{ font-size:12.5px; padding:6px 8px; }
  .stats{ display:grid; grid-template-columns:repeat(5,1fr); gap:10px; margin:14px 0 18px; }
  .stat{ background:var(--gray-100); border-radius:10px; padding:12px 6px; text-align:center; }
  .stat .l{ font-size:11.5px; color:var(--gray-500); font-weight:600; }
  .stat .n{ font-size:22px; font-weight:800; margin-top:2px; }
  .tree-process{ margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--gray-200); }
  .tree-process:last-child{ border-bottom:none; }
  .tree-l1{ font-weight:700; color:var(--violet); font-size:15px; margin-bottom:6px; }
  .tree-l2{ font-weight:700; font-size:13.5px; margin:6px 0 2px 10px; }
  .tree-l3{ font-size:12.5px; color:var(--gray-700); margin:2px 0 2px 26px; }
  .tree-l4{ font-size:12px; color:var(--gray-500); margin:2px 0 2px 42px; }
  .tree-l4::before{ content:"→ "; }
  .tree-l5{ font-size:11.5px; color:var(--violet-dark); margin:2px 0 2px 58px; font-family:ui-monospace,Menlo,monospace; }
  .tree-l5::before{ content:"· "; }
  .tree-empty{ text-align:center; color:var(--gray-400); font-size:13.5px; padding:40px 10px; line-height:1.7; }

  .dash-list{ display:flex; flex-direction:column; gap:10px; }
  .dash-item{ background:#fff; border:1px solid var(--gray-200); border-radius:12px; padding:14px 16px;
    display:flex; justify-content:space-between; align-items:center; gap:10px; flex-wrap:wrap; }
  .dash-item h3{ margin:0 0 3px; font-size:14.5px; }
  .dash-item .meta{ font-size:12px; color:var(--gray-500); }
  .progress-dots{ display:flex; gap:4px; margin-top:6px; }
  .dot{ width:8px; height:8px; border-radius:50%; background:var(--gray-200); }
  .dot.on{ background:var(--violet); }

  table.admin-table{ width:100%; border-collapse:collapse; font-size:13px; }
  table.admin-table th{ text-align:left; font-size:11.5px; color:var(--gray-500); text-transform:uppercase;
    padding:8px 10px; border-bottom:1px solid var(--gray-200); }
  table.admin-table td{ padding:8px 10px; border-bottom:1px solid var(--gray-100); vertical-align:middle; }
  .tabs{ display:flex; gap:6px; margin-bottom:16px; border-bottom:1px solid var(--gray-200); }
  .tab{ padding:9px 14px; font-size:13.5px; font-weight:600; color:var(--gray-500); cursor:pointer; border-bottom:2px solid transparent; }
  .tab.active{ color:var(--violet); border-bottom-color:var(--violet); }
  .inline-form{ display:flex; gap:8px; margin-bottom:16px; flex-wrap:wrap; }
  .inline-form input,.inline-form select{ width:auto; flex:1; min-width:140px; }

  .modal-overlay{ position:fixed; inset:0; background:rgba(0,0,0,.35); display:flex; align-items:center;
    justify-content:center; z-index:40; }
  .modal{ background:#fff; border-radius:14px; padding:24px; width:380px; max-width:92vw; }
  .modal h3{ margin:0 0 16px; font-size:16px; }

  .toast{ position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--gray-900); color:#fff;
    padding:10px 18px; border-radius:8px; font-size:13px; opacity:0; pointer-events:none; transition:opacity .25s ease; z-index:50; }
  .toast.show{ opacity:1; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://rmqiqhtdgwkatdxelywh.supabase.co';
const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJtcWlxaHRkZ3drYXRkeGVseXdoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQ4OTU2NDEsImV4cCI6MjEwMDQ3MTY0MX0.ICgW-E0BL7pTEynX3FpeLVv9K0nYuW3xH5xn_j_Glc4';
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

const MEGA_CYCLES = [
  "Hire to Retire","Order to Cash","Procure to Pay","Record to Report",
  "Plan to Fulfill","Idea to Market","Acquire to Retire (Asset)","Issue to Resolution"
];

let state = {
  screen: 'loading',
  user: null,
  profile: null,
  departments: [],
  companies: [],
  expandedCompanyId: null,
  showNewCompanyModal: false,
  newCompanyProcessNames: [],
  companySettingsFor: null,
  editorProcess: null,
  editorSiblingProcesses: [],
  editingMegaCycle: false,
  editorSelectedSpId: null,
  editorSelectedStepId: null,
  editorSelectedTaskId: null,
  adminTab: 'pending',
  adminPending: [],
  adminUsers: [],
  authError: ''
};

function escapeHtml(s){
  return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

/* ================= VISIBLE ERROR BANNER (temporary debug aid) ================= */
window.addEventListener('error', function(e){
  showErrorBanner('JS ERROR: ' + e.message + ' — ' + (e.filename||'') + ':' + e.lineno + ':' + e.colno + '\n' + (e.error && e.error.stack ? e.error.stack : ''));
});
window.addEventListener('unhandledrejection', function(e){
  showErrorBanner('PROMISE ERROR: ' + (e.reason && e.reason.message ? e.reason.message : e.reason) + '\n' + (e.reason && e.reason.stack ? e.reason.stack : ''));
});
function showErrorBanner(text){
  let banner = document.getElementById('debug-error-banner');
  if(!banner){
    banner = document.createElement('div');
    banner.id = 'debug-error-banner';
    banner.style.cssText = 'position:fixed;top:0;left:0;right:0;background:#dc2626;color:#fff;padding:14px 20px;font-family:ui-monospace,Menlo,monospace;font-size:12px;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto;box-shadow:0 4px 12px rgba(0,0,0,.3);';
    document.body.appendChild(banner);
  }
  const entry = document.createElement('div');
  entry.style.cssText = 'border-top:1px solid rgba(255,255,255,.3); padding-top:8px; margin-top:8px;';
  entry.textContent = new Date().toLocaleTimeString() + '  ' + text;
  banner.appendChild(entry);
}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(toast._h); toast._h = setTimeout(()=> t.classList.remove('show'), 2400);
}
const debounceTimers = {};
function debounced(key, fn, delay=700){
  clearTimeout(debounceTimers[key]);
  debounceTimers[key] = setTimeout(fn, delay);
}
function sortTree(process){
  if(!process.subprocesses) return process;
  process.subprocesses.sort((a,b)=>a.position-b.position);
  process.subprocesses.forEach(sp=>{
    (sp.steps||[]).sort((a,b)=>a.position-b.position);
    sp.steps.forEach(st=>{
      (st.tasks||[]).sort((a,b)=>a.position-b.position);
      st.tasks.forEach(t=> (t.work_instructions||[]).sort((a,b)=>a.position-b.position));
    });
  });
  return process;
}

/* ================= INIT / AUTH ================= */
sb.auth.onAuthStateChange((event, session) => {
  if(event === 'PASSWORD_RECOVERY'){
    state.screen = 'reset-password';
    render();
  }
});
async function init(){
  try {
    const { data: { session } } = await sb.auth.getSession();
    if(session){ state.user = session.user; await loadMyProfile(); }
    else state.screen = 'login';
  } catch(e){
    state.screen = 'connection-error';
    state.authError = String(e.message || e);
  }
  render();
}
async function loadMyProfile(){
  const { data, error } = await sb.from('profiles').select('*').eq('id', state.user.id).single();
  if(error || !data){ state.screen = 'login'; return; }
  state.profile = data;
  if(data.status === 'pending') state.screen = 'pending';
  else if(data.status === 'rejected') state.screen = 'rejected';
  else {
    state.screen = 'companies';
    await loadCompanies();
  }
}
async function doSignUp(email, password, fullName){
  state.authError = '';
  if(!email || !password){ state.authError = 'Email and password are required.'; render(); return; }
  const { error } = await sb.auth.signUp({ email, password, options:{ data:{ full_name: fullName } } });
  if(error){ state.authError = error.message; render(); return; }
  toast('Access requested — an admin needs to approve you.');
  state.screen = 'login'; render();
}
async function doSignIn(email, password){
  state.authError = '';
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if(error){ state.authError = error.message; render(); return; }
  state.user = data.user;
  await loadMyProfile();
  render();
}
async function doSignOut(){
  await sb.auth.signOut();
  state = { screen:'login', user:null, profile:null, departments:[],
    companies:[], expandedCompanyId:null, showNewCompanyModal:false, newCompanyProcessNames:[], companySettingsFor:null,
    editorProcess:null, editorSiblingProcesses:[], editingMegaCycle:false,
    editorSelectedSpId:null,
    editorSelectedStepId:null,
    editorSelectedTaskId:null,
    adminTab:'pending', adminPending:[], adminUsers:[], authError:'' };
  render();
}
async function doForgotPassword(email){
  state.authError = '';
  if(!email){ state.authError = 'Please enter your email address.'; render(); return; }
  const { error } = await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.href.split('#')[0] });
  if(error){ state.authError = error.message; render(); return; }
  toast('If that email is registered, a reset link has been sent.');
  state.screen = 'login'; render();
}
async function doUpdatePassword(newPassword){
  state.authError = '';
  if(!newPassword || newPassword.length < 6){ state.authError = 'At least 6 characters.'; render(); return; }
  const { error } = await sb.auth.updateUser({ password: newPassword });
  if(error){ state.authError = error.message; render(); return; }
  toast('Password changed — you are logged in.');
  const { data: { session } } = await sb.auth.getSession();
  state.user = session.user;
  await loadMyProfile();
  render();
}

/* ================= DEPARTMENTS ================= */
async function loadDepartments(){
  const { data } = await sb.from('departments').select('*').order('name');
  state.departments = data || [];
}
async function createDepartment(name){
  if(!name.trim()) return;
  const { error } = await sb.from('departments').insert({ name: name.trim() });
  if(error){ toast(error.message); return; }
  toast('Department created.');
  await loadDepartments(); render();
}
/* ================= COMPANIES ================= */
async function loadCompanies(){
  const { data, error } = await sb.from('companies')
    .select('id, name, created_at, processes(id, l1_name, l2_locked, created_at, subprocesses(l3_locked, steps(l4_locked)))')
    .order('name');
  if(error){ toast(error.message); return; }
  (data||[]).forEach(c=>{ c.processes = (c.processes||[]).sort((a,b)=> a.l1_name.localeCompare(b.l1_name)); });
  state.companies = data || [];
}
function toggleCompanyExpand(companyId){
  state.expandedCompanyId = (state.expandedCompanyId === companyId) ? null : companyId;
  render();
}
function openNewCompanyModal(){
  state.showNewCompanyModal = true;
  state.newCompanyProcessNames = [...MEGA_CYCLES];
  render();
}
function closeNewCompanyModal(){ state.showNewCompanyModal = false; render(); }
function addDraftProcessName(){ state.newCompanyProcessNames.push(''); render(); }
function removeDraftProcessName(idx){ state.newCompanyProcessNames.splice(idx,1); render(); }
function onDraftProcessNameInput(idx, v){ state.newCompanyProcessNames[idx] = v; }
async function submitNewCompany(name){
  if(!name || !name.trim()){ toast('Please enter a company name.'); return; }
  const names = state.newCompanyProcessNames.map(n=>n.trim()).filter(Boolean);
  const { error } = await sb.rpc('create_company_with_processes', { p_name: name.trim(), p_process_names: names });
  if(error){ toast(error.message); return; }
  state.showNewCompanyModal = false;
  toast('Company created.');
  await loadCompanies(); render();
}
function openCompanySettings(companyId){ state.companySettingsFor = companyId; render(); }
function closeCompanySettings(){ state.companySettingsFor = null; render(); }
async function addProcessToCompany(companyId, name){
  if(!name || !name.trim()){ toast('Please enter a process name.'); return; }
  const { error } = await sb.from('processes')
    .insert({ l1_name: name.trim(), company_id: companyId, created_by: state.profile.id, l1_locked:true })
    .select().single();
  if(error){ toast(error.message); return; }
  toast('Process added.');
  await loadCompanies(); render();
}
async function deleteCompany(companyId){
  const c = state.companies.find(x=>x.id===companyId);
  if(!c) return;
  const hasData = (c.processes||[]).some(p=> (p.subprocesses||[]).length>0);
  const msg = c.processes.length===0
    ? `Delete "${c.name}"? This company has no mega-cycles yet.`
    : hasData
      ? `Delete "${c.name}"? This will permanently remove all ${c.processes.length} mega-cycle(s) and all captured data (sub-processes, steps, tasks, work instructions) inside them. This cannot be undone.`
      : `Delete "${c.name}"? This will permanently remove its ${c.processes.length} mega-cycle(s). This cannot be undone.`;
  if(!window.confirm(msg)) return;
  const { error } = await sb.rpc('delete_company', { p_company_id: companyId });
  if(error){ toast(error.message); return; }
  state.companySettingsFor = null;
  state.expandedCompanyId = null;
  toast('Company deleted.');
  await loadCompanies(); render();
}
async function removeProcessFromCompany(processId){
  const { count } = await sb.from('subprocesses').select('id', { count:'exact', head:true }).eq('process_id', processId);
  const hasData = (count || 0) > 0;
  const msg = hasData
    ? 'This mega-cycle already has captured data (sub-processes, steps, tasks, or work instructions). Deleting it will permanently remove all of it. Continue?'
    : 'Delete this mega-cycle?';
  if(!window.confirm(msg)) return;
  const { error } = await sb.from('processes').delete().eq('id', processId);
  if(error){ toast(error.message); return; }
  toast('Mega-cycle removed.');
  await loadCompanies(); render();
}

/* ================= EDITOR ================= */
async function openEditor(processId){
  state.screen = 'loading'; render();
  const { data, error } = await sb.from('processes').select(`
      id, l1_name, company_id, department_id, created_by, l1_locked, l2_locked, l3_locked, l4_locked, created_at,
      companies ( name ),
      subprocesses ( id, name, position, l3_locked, l4_locked,
        steps ( id, text, position, l4_locked,
          tasks ( id, text, position, l5_locked,
            work_instructions ( id, transaction, field, tool, position )
          )
        )

/* ================= EXCEL EXPORT ================= */
async function exportExcel(processIdOnly){
  let query = sb.from('processes').select(`
      l1_name, companies(name), departments(name),
      subprocesses ( name, position,
        steps ( text, position,
          tasks ( text, position,
            work_instructions ( transaction, field, tool, position )
          )
        )
      )
    `);
  if(processIdOnly) query = query.eq('id', processIdOnly);
  const { data, error } = await query;
  if(error){ toast(error.message); return; }
  const rows = [];
  (data||[]).forEach(proc=>{
    (proc.subprocesses||[]).sort((a,b)=>a.position-b.position).forEach(sp=>{
      if(!sp.name || !sp.name.trim()) return;
      (sp.steps||[]).sort((a,b)=>a.position-b.position).forEach(st=>{
        if(!st.text || !st.text.trim()) return;
        const base = {
          "Company": proc.companies ? proc.companies.name : '',
          "Department": proc.departments ? proc.departments.name : '',
          "L1 Mega-cycle": proc.l1_name,
          "L2 Sub-process": sp.name,
          "L3 Process step": st.text
        };
        const tasks = (st.tasks||[]).sort((a,b)=>a.position-b.position);
        if(tasks.length===0){ rows.push({...base, "L4 Task":'', "L5 Transaction":'', "L5 Field":'', "L5 Tool":''}); return; }
        tasks.forEach(task=>{
          if(!task.text || !task.text.trim()) return;
          const wis = (task.work_instructions||[]).sort((a,b)=>a.position-b.position);
          if(wis.length===0){ rows.push({...base, "L4 Task":task.text, "L5 Transaction":'', "L5 Field":'', "L5 Tool":''}); return; }
          wis.forEach(wi=>{
            if(!wi.transaction && !wi.field && !wi.tool) return;
            rows.push({...base, "L4 Task":task.text, "L5 Transaction":wi.transaction||'', "L5 Field":wi.field||'', "L5 Tool":wi.tool||''});
          });
        });
      });
    });
  });
  if(rows.length===0){ toast('Nothing to export.'); return; }
  const ws = XLSX.utils.json_to_sheet(rows);
  ws['!cols'] = [{wch:16},{wch:16},{wch:20},{wch:20},{wch:26},{wch:26},{wch:16},{wch:16},{wch:16}];
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "Process Capture");
  XLSX.writeFile(wb, "Velogy_Process_Capture.xlsx");
  toast('Exported.');
}

      <p style="margin:0 0 16px; font-size:12px; color:var(--gray-500); font-weight:600; text-transform:uppercase; letter-spacing:.03em;">Mega-cycles</p>
      ${c.processes.length===0 ? `<div class="empty-note">No mega-cycles yet.</div>` : `<div style="display:flex; flex-direction:column; gap:2px;">${c.processes.map(p=>`
        <div class="row-input" style="padding:6px 0; border-bottom:1px solid var(--gray-100);">
          <span style="flex:1; font-size:13.5px;">${escapeHtml(p.l1_name)}</span>
          <button class="icon-btn" onclick="removeProcessFromCompany('${p.id}')">✕</button>
        </div>`).join('')}</div>`}
      <div class="row-input" style="margin-top:14px;">
        <input type="text" id="cs-new-process-name" placeholder="New mega-cycle name">
        <button class="btn btn-primary" style="flex-shrink:0;" onclick="addProcessToCompany('${c.id}', document.getElementById('cs-new-process-name').value); document.getElementById('cs-new-process-name').value='';">Add</button>
      </div>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-top:22px; padding-top:14px; border-top:1px solid var(--gray-200);">
        <button class="link-btn" style="color:var(--red); padding:0;" onclick="deleteCompany('${c.id}')">Delete company</button>
        <button class="btn btn-ghost" onclick="closeCompanySettings()">Close</button>
      </div>
    </div>
  </div>`;
}

/* ---------- editor rendering (left panel + right tree) ---------- */
function renderEditor(){
  const app = document.getElementById('app');
  const p = state.editorProcess;
  const companyName = p.companies ? p.companies.name : '';
  app.innerHTML = `<div class="wrap">
    ${renderHeader()}
    <div class="header" style="padding:14px 24px; flex-wrap:wrap;">
      <div style="display:flex; align-items:center; gap:10px; flex-wrap:wrap;">
        <div style="font-weight:700; font-size:15px;">${escapeHtml(companyName)} — ${escapeHtml(p.l1_name || '')}</div>
        <button class="btn btn-ghost" style="padding:5px 9px; font-size:12px;" onclick="toggleMegaCycleSwitcher()" title="Switch mega-cycle">✎</button>
        ${state.editingMegaCycle ? `
          <select onchange="switchMegaCycle(this.value)" style="width:auto; max-width:260px;">
            <option value="">— switch to —</option>
            ${state.editorSiblingProcesses.filter(s=>s.id!==p.id).map(s=>`<option value="${s.id}">${escapeHtml(s.l1_name)}</option>`).join('')}
          </select>` : ''}
      </div>
      <div class="actions">
        <button class="btn btn-ghost" onclick="backToCompanies()">← Back</button>
        <button class="btn btn-ghost" onclick="exportExcel(state.editorProcess.id)">⭳ Export</button>
      </div>
    </div>
    <div class="grid">
      <div id="editorLeft"></div>
      <div class="card" style="position:sticky; top:20px;">
        <div class="card-title" style="font-size:16px; margin-bottom:2px;">Process tree — live preview</div>
        <div class="card-hint" style="margin-bottom:0;">This view updates live as you fill things in.</div>
        <div class="stats" id="stats"></div>
        <div id="treeBody"></div>
      </div>
    </div>
  </div>`;
  renderEditorLeftPanel();
  updateEditorTree();
}

function renderSavedRow(unlockCall){
  return `<div style="display:flex; align-items:center; gap:8px; margin-top:10px;">
    <div class="saved-indicator">✓ Saved</div>
    <button class="btn btn-ghost" onclick="${unlockCall}">Edit</button>
  </div>`;
}

function renderEditorLeftPanel(){
  const p = state.editorProcess;
  const selSp = p.l2_locked ? (p.subprocesses.find(s=>s.id===state.editorSelectedSpId) || null) : null;
  const selStep = (selSp && selSp.l3_locked) ? (selSp.steps.find(s=>s.id===state.editorSelectedStepId) || null) : null;
  const selTask = (selStep && selStep.l4_locked) ? (selStep.tasks.find(t=>t.id===state.editorSelectedTaskId) || null) : null;

  const c2 = p.l2_locked ? 'done' : 'active';
  const c3 = !p.l2_locked ? 'disabled' : (!selSp ? 'disabled' : (selSp.l3_locked ? 'done' : 'active'));
  const c4 = (!selSp || !selSp.l3_locked) ? 'disabled' : (!selStep ? 'disabled' : (selStep.l4_locked ? 'done' : 'active'));
  const c5 = (!selStep || selStep.l4_locked!==true) ? 'disabled' : (!selTask ? 'disabled' : (selTask.l5_locked ? 'done' : 'active'));

  let html = '';

  html += `<div class="card ${c2}">
    <div class="card-head" style="${p.l2_locked?'opacity:.5;':''}"><div class="card-head-left"><span class="badge badge-purple">L2</span><span class="card-title">Sub-processes</span></div>
    <span class="card-hint">short noun phrases</span></div>`;
  if(!p.l2_locked){
    if(p.subprocesses.length===0) html += `<div class="empty-note">No sub-processes yet.</div>`;
    p.subprocesses.forEach(sp=>{
      html += `<div class="row-input">
        <input type="text" placeholder="e.g. Order management" value="${escapeHtml(sp.name)}" oninput="onSubName('${sp.id}', this.value)">
        <button class="icon-btn" onclick="removeSubprocess('${sp.id}')">✕</button>
      </div>`;
    });
    html += `<button class="link-btn" onclick="addSubprocess()">+ add sub-process</button>`;
  } else {
    html += `<div class="empty-note" style="margin-bottom:8px; opacity:.5;">Click a sub-process to work on it in L3. Click it again to switch to another one.</div>`;
    p.subprocesses.forEach(sp=>{
      const isSel = sp.id === state.editorSelectedSpId;
      const hasSteps = sp.steps.some(s=>s.text.trim());
      html += `<div class="sp-row ${isSel?'sel':''}" onclick="toggleSpSelection('${sp.id}')">
        <span>${escapeHtml(sp.name || '(untitled)')}</span>
        <span style="font-size:11px; font-weight:600; opacity:.85;">${isSel ? 'currently editing' : (hasSteps ? '✓ has steps' : 'click to edit')}</span>
      </div>`;
    });
  }
  html += p.l2_locked
    ? renderSavedRow('unlockL2()')
    : `<button id="l2-save-btn" class="lock-btn" ${!p.subprocesses.some(s=>s.name.trim()) ? 'disabled':''} onclick="lockL2()">Save L2 → go to L3</button>`;
  html += `</div>`;

  /* ---------- L3: steps of the selected sub-process ---------- */
  html += `<div class="card ${c3}">
    <div class="card-head" style="${(selSp&&selSp.l3_locked)?'opacity:.5;':''}"><div class="card-head-left"><span class="badge ${p.l2_locked?'badge-navy':'badge-gray'}">L3</span><span class="card-title">Process steps</span></div>
    <span class="card-hint">verb first: "create...", "check..."</span></div>`;
  if(!p.l2_locked){ html += `<div class="empty-note">Save L2 first to add process steps.</div>`; }
  else if(p.subprocesses.length===0){ html += `<div class="empty-note">No sub-processes yet — add one in L2 above.</div>`; }
  else if(!selSp){ html += `<div class="empty-note">Click a sub-process in L2 above to add its steps here.</div>`; }
  else {
    html += `<div class="subblock-title" style="margin-bottom:10px;">${escapeHtml(selSp.name || '(untitled)')}</div>`;
    if(!selSp.l3_locked){
      if(selSp.steps.length===0) html += `<div class="empty-note">No steps yet.</div>`;
      selSp.steps.forEach(st=>{
        html += `<div class="row-input">
          <input type="text" placeholder="e.g. Create sales order" value="${escapeHtml(st.text)}" oninput="onStepText('${selSp.id}','${st.id}', this.value)">
          <button class="icon-btn" onclick="removeStep('${selSp.id}','${st.id}')">✕</button>
        </div>`;
      });
      html += `<button class="link-btn" onclick="addStep('${selSp.id}')">+ add step</button>`;
      const hasAnyStep = selSp.steps.some(s=>s.text.trim());
      html += `<button id="l3-save-btn" class="lock-btn" ${!hasAnyStep ? 'disabled':''} onclick="lockL3ForSp('${selSp.id}')">Save L3 → select a step</button>`;
    } else {
      html += `<div class="empty-note" style="margin-bottom:8px; opacity:.5;">Click a step to work on its tasks in L4.</div>`;
      selSp.steps.forEach(st=>{
        const isSel = st.id === state.editorSelectedStepId;
        const hasTasks = st.tasks.some(t=>t.text.trim());
        const badge = isSel ? 'currently editing' : (hasTasks ? '✓ has tasks' : 'click to edit');
        html += `<div class="sp-row ${isSel?'sel':''}" onclick="toggleStepSelection('${st.id}')">
          <span>${escapeHtml(st.text)}</span>
          <span style="font-size:11px; font-weight:600; opacity:.85; white-space:nowrap;">${badge}</span>
        </div>`;
      });
      html += renderSavedRow(`unlockL3ForSp('${selSp.id}')`);
    }
  }
  html += `</div>`;

  /* ---------- L4: tasks of the selected step ---------- */
  html += `<div class="card ${c4}">
    <div class="card-head" style="${(selStep&&selStep.l4_locked)?'opacity:.5;':''}"><div class="card-head-left"><span class="badge ${(selSp&&selSp.l3_locked)?'badge-navy':'badge-gray'}">L4</span><span class="card-title">Tasks</span></div>
    <span class="card-hint">verb + object, e.g. "Enter customer ID"</span></div>`;
  if(!selSp || !selSp.l3_locked){ html += `<div class="empty-note">Save L3 for a sub-process first, then select a step.</div>`; }
  else if(!selStep){ html += `<div class="empty-note">Click a step in L3 above to work on its tasks here.</div>`; }
  else {
    html += `<div class="subblock-title" style="margin-bottom:10px;">${escapeHtml(selStep.text)}</div>`;
    if(!selStep.l4_locked){
      if(selStep.tasks.length===0) html += `<div class="empty-note">No tasks yet.</div>`;
      selStep.tasks.forEach(task=>{
        html += `<div class="row-input">
          <input type="text" placeholder="e.g. Enter customer ID" value="${escapeHtml(task.text)}" oninput="onTaskText('${selSp.id}','${selStep.id}','${task.id}', this.value)">
          <button class="icon-btn" onclick="removeTask('${selSp.id}','${selStep.id}','${task.id}')">✕</button>
        </div>`;
      });
      html += `<button class="link-btn" onclick="addTask('${selSp.id}','${selStep.id}')">+ add task</button>`;
      const hasAnyTask = selStep.tasks.some(t=>t.text.trim());
      html += `<button id="l4-save-btn" class="lock-btn" ${!hasAnyTask ? 'disabled':''} onclick="lockL4ForStep('${selSp.id}','${selStep.id}')">Save L4 → select a task for L5</button>`;
    } else {
      html += `<div class="empty-note" style="margin-bottom:8px; opacity:.5;">Click a task to work on its work instructions in L5.</div>`;
      selStep.tasks.forEach(task=>{
        const isSel = task.id === state.editorSelectedTaskId;
        const hasWI = task.work_instructions.some(wi=>wi.transaction.trim()||wi.field.trim()||wi.tool.trim());
        html += `<div class="sp-row ${isSel?'sel':''}" onclick="toggleTaskSelection('${task.id}')">
          <span>${escapeHtml(task.text)}</span>
          <span style="font-size:11px; font-weight:600; opacity:.85;">${isSel ? 'currently editing' : (hasWI ? '✓ has instructions' : 'needs instructions')}</span>
        </div>`;
      });
      html += renderSavedRow(`unlockL4ForStep('${selSp.id}','${selStep.id}')`);
    }
  }
  html += `</div>`;

  /* ---------- L5: work instructions of the selected task ---------- */
  html += `<div class="card ${c5}">
    <div class="card-head" style="${(selTask&&selTask.l5_locked)?'opacity:.5;':''}"><div class="card-head-left"><span class="badge ${selTask?'badge-green':'badge-gray'}">L5</span><span class="card-title">Work instructions</span></div>
    <span class="card-hint">system-specific: transaction, field, tool</span></div>`;
  if(!selStep || !selStep.l4_locked){
    html += `<div class="empty-note">Save L4 for a step first, then select a task.</div>`;
  } else if(!selTask){
    html += `<div class="empty-note">Click a task in L4 above to add its work instructions here.</div>`;
  } else {
    html += `<div class="subblock-title" style="margin-bottom:10px;">${escapeHtml(selTask.text)}</div>`;
    if(selTask.work_instructions.length===0) html += `<div class="empty-note">No work instructions yet.</div>`;
    selTask.work_instructions.forEach(wi=>{
      html += `<div class="wi-row">
        <input type="text" placeholder="Transaction" value="${escapeHtml(wi.transaction)}" ${selTask.l5_locked?'disabled':''} oninput="onWI('${selSp.id}','${selStep.id}','${selTask.id}','${wi.id}','transaction', this.value)">
        <input type="text" placeholder="Field" value="${escapeHtml(wi.field)}" ${selTask.l5_locked?'disabled':''} oninput="onWI('${selSp.id}','${selStep.id}','${selTask.id}','${wi.id}','field', this.value)">
        <input type="text" placeholder="Tool" value="${escapeHtml(wi.tool)}" ${selTask.l5_locked?'disabled':''} oninput="onWI('${selSp.id}','${selStep.id}','${selTask.id}','${wi.id}','tool', this.value)">
        ${selTask.l5_locked ? '<span></span>' : `<button class="icon-btn" onclick="removeWI('${selSp.id}','${selStep.id}','${selTask.id}','${wi.id}')">✕</button>`}
      </div>`;
    });
    if(!selTask.l5_locked){
      html += `<button class="link-btn" onclick="addWI('${selSp.id}','${selStep.id}','${selTask.id}')">+ add work instruction</button>`;
      const hasAnyWI = selTask.work_instructions.some(wi=>wi.transaction.trim()||wi.field.trim()||wi.tool.trim());
      html += `<button id="l5-save-btn" class="lock-btn" ${!hasAnyWI ? 'disabled':''} onclick="lockL5ForTask('${selSp.id}','${selStep.id}','${selTask.id}')">Save L5</button>`;
    } else {
      html += renderSavedRow(`unlockL5ForTask('${selSp.id}','${selStep.id}','${selTask.id}')`);
    }
  }
  html += `</div>`;

  document.getElementById('editorLeft').innerHTML = html;
}


function updateEditorTree(){
  const p = state.editorProcess;
  const l1c = p.l1_name ? 1 : 0;
  const l2c = p.subprocesses.filter(s=>s.name.trim()).length;
  const l3c = p.subprocesses.reduce((n,s)=> n + s.steps.filter(st=>st.text.trim()).length, 0);
  const l4c = p.subprocesses.reduce((n,s)=> n + s.steps.reduce((m,st)=> m + st.tasks.filter(t=>t.text.trim()).length, 0), 0);
  const l5c = p.subprocesses.reduce((n,s)=> n + s.steps.reduce((m,st)=> m + st.tasks.reduce((k,t)=> k + t.work_instructions.filter(w=>w.transaction.trim()||w.field.trim()||w.tool.trim()).length, 0), 0), 0);
  const statsEl = document.getElementById('stats');
  if(statsEl) statsEl.innerHTML = `
    <div class="stat"><div class="l">L1</div><div class="n">${l1c}</div></div>
    <div class="stat"><div class="l">L2</div><div class="n">${l2c}</div></div>
    <div class="stat"><div class="l">L3</div><div class="n">${l3c}</div></div>
    <div class="stat"><div class="l">L4</div><div class="n">${l4c}</div></div>
    <div class="stat"><div class="l">L5</div><div class="n">${l5c}</div></div>`;

  let h = '';
  if(p.l1_name){
    h += `<div class="tree-process"><div class="tree-l1">${escapeHtml(p.l1_name)}</div>`;
    p.subprocesses.forEach(sp=>{
      if(!sp.name.trim()) return;
      h += `<div class="tree-l2">${escapeHtml(sp.name)}</div>`;
      sp.steps.forEach(st=>{
        if(!st.text.trim()) return;
        h += `<div class="tree-l3">${escapeHtml(st.text)}</div>`;
        st.tasks.forEach(task=>{
          if(!task.text.trim()) return;
          h += `<div class="tree-l4">${escapeHtml(task.text)}</div>`;
          task.work_instructions.forEach(wi=>{
            if(!wi.transaction.trim() && !wi.field.trim() && !wi.tool.trim()) return;
            const parts = [wi.transaction, wi.field, wi.tool].filter(Boolean).map(escapeHtml).join(' · ');
            h += `<div class="tree-l5">${parts}</div>`;
          });
        });
      });
    });
    h += `</div>`;
  }
  const treeEl = document.getElementById('treeBody');
  if(treeEl) treeEl.innerHTML = h.trim() ? h : `<div class="tree-empty">Nothing captured yet.</div>`;
}

init();
</script>
